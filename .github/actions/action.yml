name: "Test Template"
description: "Template for running NeMo tests in a containerized environment"

inputs:
  container-image:
    description: "Container image to use for test"
    required: true
  timeout:
    description: "Max runtime of test in minutes"
    required: false
    default: "30"
  script:
    description: "Test script to execute"
    required: false
    default: ""
  is-optional:
    description: "Pass this job on failure."
    required: false
    default: "false"
  is_unit_test:
    description: "Upload coverage as unit test"
    required: false
    default: "false"
  tag:
    description: Latest or legacy test suite
    required: true
  test_case:
    description: Test case to launch
    required: true
  model:
    description: Model to launch
    required: false
  scope:
    description: "Test scope (e.g. mr-github, mr-github-slim)"
    required: false
    default: "mr-github-slim"
  n_repeat:
    description: "Number of test repetitions"
    required: false
    default: "5"
  lightweight:
    description: "Enable lightweight mode"
    required: false
    default: "false"
  platform:
    description: "Platform to run tests on (e.g. dgx_h100, dgx_gb200)"
    required: false
    default: "dgx_h100"
  cadence:
    description: "Trigger cadence for cadence filter (pr|nightly|mergegroup). Empty disables filter."
    required: false
    default: ""
  sha:
    description: "Git ref to check out. Must match the SHA used by the upstream parse step so recipes don't diverge between scheduling and execution."
    required: false
    default: ""
  unit_testmon_mode:
    description: "Unit-test selection mode: full or enforce. Enforce bootstraps a PR baseline on cache miss."
    required: false
    default: "full"
  unit_testmon_target_branch:
    description: "PR target branch used to namespace the Testmon cache."
    required: false
    default: ""
  unit_testmon_head_sha:
    description: "PR head SHA used to validate Testmon cache ancestry."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Print node name
      shell: bash -x -e -u -o pipefail {0}
      run: echo "node_name=$NODE_NAME" | tee -a "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.sha }}

    - name: Change ownership of /home/runner/
      shell: bash
      # Tolerate vanishing `.git/objects/pack/.tmp-*` files: the prior
      # `actions/checkout` may leave a background `git gc --auto` running,
      # whose `git pack-objects` renames/deletes temp files while `chown`
      # is walking the tree. On failure, wait 5 s for gc to settle, retry,
      # then succeed unconditionally.
      run: |
        sudo chown -R $(whoami) /home/runner/ 2>/dev/null && exit 0
        sleep 5
        sudo chown -R $(whoami) /home/runner/ 2>/dev/null || true

    - name: Setup python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install uuid-runtime
      shell: bash -x -e -u -o pipefail {0}
      run: |
        for i in 1 2 3; do
          apt-get update && apt-get install -y uuid-runtime && break
          echo "apt attempt $i failed, retrying..."
          sleep 10
        done

    - name: Install uv
      shell: bash -x -e -u -o pipefail {0}
      run: |
        for i in 1 2 3; do
          curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh && break
          echo "uv install attempt $i failed, retrying..."
          sleep 10
        done

    - name: Compute unit Testmon cache identity
      id: unit-testmon-identity
      if: inputs.is_unit_test == 'true' && inputs.unit_testmon_mode == 'enforce'
      shell: bash -e -u -o pipefail {0}
      continue-on-error: true
      env:
        BUCKET: ${{ inputs.test_case }}
        RECIPE_PLATFORM: ${{ inputs.platform }}
        TARGET_BRANCH: ${{ inputs.unit_testmon_target_branch }}
        PR_HEAD_SHA: ${{ inputs.unit_testmon_head_sha }}
        SOURCE_SHA: ${{ inputs.sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        PLATFORM="$RECIPE_PLATFORM"

        BUCKET_HASH=$(printf '%s' "$BUCKET" | sha256sum | cut -c1-16)
        # Production Python and unit-test modules are the only changes Testmon
        # is allowed to analyze. Any other tree change creates a cache miss.
        COMPATIBILITY_HASH=$(
          git ls-tree -r --full-tree HEAD \
            | awk -F '\t' '
                $2 ~ /^megatron\/.*\.py$/ { next }
                $2 ~ /^tests\/unit_tests\/test_[^/]+\.py$/ { next }
                $2 ~ /^tests\/unit_tests\/.*\/test_[^/]+\.py$/ { next }
                { print }
              ' \
            | sha256sum \
            | cut -c1-64
        )
        [[ "$BUCKET_HASH" =~ ^[0-9a-f]{16}$ ]]
        [[ "$COMPATIBILITY_HASH" =~ ^[0-9a-f]{64}$ ]]
        [[ -n "$TARGET_BRANCH" && ${#TARGET_BRANCH} -le 255 ]]
        [[ "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
        [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
        [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]

        TARGET_BRANCH_HASH=$(printf '%s' "$TARGET_BRANCH" | sha256sum | cut -c1-12)
        TARGET_BRANCH_KEY=$(printf '%s' "$TARGET_BRANCH" \
          | tr '[:upper:]/' '[:lower:]-' \
          | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//' \
          | cut -c1-80)
        [[ -n "$TARGET_BRANCH_KEY" && "$TARGET_BRANCH_HASH" =~ ^[0-9a-f]{12}$ ]]
        CACHE_PREFIX="unit-testmon-v3-${TARGET_BRANCH_KEY}-${TARGET_BRANCH_HASH}-${PLATFORM}-dev-${BUCKET_HASH}-${COMPATIBILITY_HASH}-"

        echo "cache_prefix=$CACHE_PREFIX" | tee -a "$GITHUB_OUTPUT"
        echo "cache_key=${CACHE_PREFIX}${PR_HEAD_SHA,,}-${SOURCE_SHA,,}-${RUN_ID}-${RUN_ATTEMPT}" | tee -a "$GITHUB_OUTPUT"

    # The key is named for the PR target branch. GitHub additionally scopes the
    # stored cache to the synthetic refs/heads/pull-request/<number> branch.
    - name: Restore unit Testmon baseline
      id: restore-unit-testmon
      if: inputs.is_unit_test == 'true' && inputs.unit_testmon_mode == 'enforce' && steps.unit-testmon-identity.outcome == 'success'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      continue-on-error: true
      with:
        path: assets_dir/testmon
        key: ${{ steps.unit-testmon-identity.outputs.cache_key }}
        restore-keys: ${{ steps.unit-testmon-identity.outputs.cache_prefix }}

    - name: Resolve unit Testmon mode
      id: unit-testmon
      if: inputs.is_unit_test == 'true'
      shell: bash -e -u -o pipefail {0}
      env:
        REQUESTED_MODE: ${{ inputs.unit_testmon_mode }}
        IDENTITY_OUTCOME: ${{ steps.unit-testmon-identity.outcome }}
        MATCHED_KEY: ${{ steps.restore-unit-testmon.outputs.cache-matched-key }}
        CACHE_PREFIX: ${{ steps.unit-testmon-identity.outputs.cache_prefix }}
        CURRENT_HEAD_SHA: ${{ inputs.unit_testmon_head_sha }}
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        FALLBACK_REASON=""
        BASELINE_VALID=false
        if [[ "$IDENTITY_OUTCOME" == "success" \
          && "$MATCHED_KEY" == "$CACHE_PREFIX"* \
          && "$CURRENT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
          CACHE_SUFFIX=${MATCHED_KEY#"$CACHE_PREFIX"}
          PRODUCER_SHA=${CACHE_SUFFIX%%-*}
          if [[ "$PRODUCER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            # Synthetic merge commits are recreated as the PR changes and are
            # not a reliable ancestry chain. PR head commits are.
            COMPARE_URL="https://api.github.com/repos/$REPOSITORY/compare/$PRODUCER_SHA...$CURRENT_HEAD_SHA"
            if COMPARE_STATUS=$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$COMPARE_URL" \
              | python -c 'import json, sys; print(json.load(sys.stdin)["status"])'); then
              if [[ "$COMPARE_STATUS" == "ahead" || "$COMPARE_STATUS" == "identical" ]]; then
                BASELINE_VALID=true
              fi
            fi
          fi
        fi
        case "$REQUESTED_MODE" in
          full)
            EFFECTIVE_MODE=full
            ;;
          enforce)
            if [[ "$BASELINE_VALID" == "true" ]]; then
              EFFECTIVE_MODE=enforce
            elif [[ "$IDENTITY_OUTCOME" == "success" ]]; then
              EFFECTIVE_MODE=bootstrap
              FALLBACK_REASON="no compatible PR baseline was restored; generating one"
              echo "::notice::Compatible Testmon cache unavailable; running the full bucket and generating a PR baseline."
            else
              EFFECTIVE_MODE=full
              FALLBACK_REASON="cache identity could not be computed; running the full bucket without saving a baseline"
              echo "::warning::Unable to compute a trustworthy Testmon cache identity; running the full unit-test bucket."
            fi
            ;;
          *)
            echo "Unsupported unit_testmon_mode: $REQUESTED_MODE" >&2
            exit 2
            ;;
        esac
        mkdir -p assets_dir/testmon
        : > assets_dir/testmon/summary.md
        echo "mode=$EFFECTIVE_MODE" | tee -a "$GITHUB_OUTPUT"
        if [[ "$EFFECTIVE_MODE" == "bootstrap" ]]; then
          echo "save_baseline=true" | tee -a "$GITHUB_OUTPUT"
        else
          echo "save_baseline=false" | tee -a "$GITHUB_OUTPUT"
        fi
        {
          echo "### Unit Testmon"
          echo
          echo "- Requested mode: $REQUESTED_MODE"
          echo "- Effective mode: $EFFECTIVE_MODE"
          if [[ "$REQUESTED_MODE" == "enforce" ]]; then
            echo "- Restored cache: ${MATCHED_KEY:-none}"
          fi
          if [[ -n "$FALLBACK_REASON" ]]; then
            echo "- Fallback: $FALLBACK_REASON"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create run-script (unit test)
      shell: bash -x -e -u -o pipefail {0}
      if: inputs.is_unit_test == 'true'
      run: |
        echo "::group::Create run-script"
        cmd=$(cat <<'RUN_TEST_EOF'
        #!/bin/bash

        export PYTHONPATH=$(pwd)
        export NEMORUN_HOME=$(pwd)
        export NCCL_DEBUG=INFO
        export PIP_DEFAULT_TIMEOUT=120
        export PIP_RETRIES=5
        export UV_HTTP_TIMEOUT=120
        uv venv .venv
        uv cache clean
        uv sync --no-cache --only-group test
        uv run python tests/test_utils/python_scripts/launch_nemo_run_workload.py \
          --scope unit-tests \
          --model unit-tests \
          --test-case "${{ inputs.test_case }}" \
          --environment dev \
          --platform ${{ inputs.platform }} \
          --tag ${{ inputs.tag }} \
          --unit-testmon-mode "${{ steps.unit-testmon.outputs.mode }}" \
          --container-image ${{ inputs.container-image }} \
          --hf-home /mnt/datadrive/TestData/nemo-fw/TestData/HF_HOME

        RUN_TEST_EOF
        )
        echo "$cmd" | tee "job.sh"
        echo "::endgroup::"

    - name: Create run-script (e2e test)
      shell: bash -x -e -u -o pipefail {0}
      if: inputs.is_unit_test == 'false'
      env:
        MODEL: ${{ inputs.model }}
      run: |
        echo "::group::Create run-script"
        cmd=$(cat <<'RUN_TEST_EOF'
        #!/bin/bash
        set -euxo pipefail

        ARGS=(
          --scope ${{ inputs.scope }}
          --n-repeat ${{ inputs.n_repeat }}
        )
        if [ "${{ inputs.lightweight }}" == "true" ]; then
          ARGS+=(--enable-lightweight-mode)
        fi
        if [ -n "${{ inputs.cadence }}" ]; then
          ARGS+=(--cadence ${{ inputs.cadence }})
        fi

        export PYTHONPATH=$(pwd)
        export NEMORUN_HOME=$(pwd)
        export PIP_DEFAULT_TIMEOUT=120
        export PIP_RETRIES=5
        export UV_HTTP_TIMEOUT=120
        uv venv .venv
        uv cache clean
        uv sync --no-cache --only-group test
        uv run python tests/test_utils/python_scripts/launch_nemo_run_workload.py \
          ${ARGS[@]} \
          --model ${{ inputs.model }} \
          --test-case ${{ inputs.test_case }} \
          --environment dev \
          --platform ${{ inputs.platform }} \
          --container-image ${{ inputs.container-image }} \
          --data-dir /mnt/datadrive/TestData/megatron-lm/artifacts \
          --hf-home /mnt/datadrive/TestData/nemo-fw/TestData/HF_HOME

        RUN_TEST_EOF
        )
        echo "$cmd" | tee "job.sh"
        echo "::endgroup::"

    - name: Set timeout
      shell: bash -x -e -u -o pipefail {0}
      id: timeout_in_seconds
      run: echo "main=$(( ${{ inputs.timeout }} * 60 ))" | tee -a "$GITHUB_OUTPUT"

    - name: Pull container
      shell: bash -x -e -u -o pipefail {0}
      run: |
        echo "::group::Pull container"
        docker pull ${{ inputs.container-image }}
        echo "::endgroup::"

    - name: Run main script
      shell: bash -x -e -u -o pipefail {0}
      id: run-main-script
      run: |
        { set +x; } 2>/dev/null
        echo -e "\033[1;34m┌─ launching test ─────────────────────────────────────────────────────────┐\033[0m"
        echo -e "\033[1;34m│  test case : ${{ inputs.test_case }}\033[0m"
        echo -e "\033[1;34m│  platform  : ${{ inputs.platform }}   scope: ${{ inputs.scope }}\033[0m"
        echo -e "\033[1;34m│  container : ${{ inputs.container-image }}\033[0m"
        echo -e "\033[1;34m└──────────────────────────────────────────────────────────────────────────┘\033[0m"
        { set -x; } 2>/dev/null
        echo "::group::Logs"
        EXIT_CODE=0
        /bin/bash job.sh || EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" | tee -a "$GITHUB_OUTPUT"
        echo "::endgroup::"
        exit $EXIT_CODE

    - name: Prepare unit Testmon baseline cache
      id: prepare-unit-testmon-cache
      if: inputs.is_unit_test == 'true' && steps.unit-testmon.outputs.save_baseline == 'true' && steps.run-main-script.outcome == 'success'
      shell: bash -e -u -o pipefail {0}
      env:
        CACHE_DIR: assets_dir/testmon
      run: |
        sudo chown -R "$(id -u):$(id -g)" "$CACHE_DIR"
        test -s "$CACHE_DIR/prod/.testmondata"
        test -s "$CACHE_DIR/experimental/.testmondata"

    - name: Save unit Testmon baseline
      if: inputs.is_unit_test == 'true' && steps.unit-testmon.outputs.save_baseline == 'true' && steps.prepare-unit-testmon-cache.outcome == 'success' && steps.unit-testmon-identity.outcome == 'success'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: assets_dir/testmon
        key: ${{ steps.unit-testmon-identity.outputs.cache_key }}

    - name: Publish unit Testmon summary
      if: always() && inputs.is_unit_test == 'true'
      shell: bash
      env:
        SUMMARY_FILE: assets_dir/testmon/summary.md
      run: |
        if [[ -f "$SUMMARY_FILE" ]]; then
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Check result
      id: check
      shell: bash -e -u -o pipefail {0}
      if: always()
      env:
        IS_UNIT_TEST: ${{ inputs.is_unit_test == 'true' }}
        MAIN_CONCLUSION: ${{ steps.run-main-script.conclusion }}
        MAIN_EXIT_CODE: ${{ steps.run-main-script.outputs.exit_code }}
      run: |
        logs_report=logs-${{ inputs.test_case }}-${{ github.run_id }}-$(cat /proc/sys/kernel/random/uuid)
        echo "logs_report=$logs_report" | sed 's/\//-/g' | sed 's/\*/-/g' | tee -a "$GITHUB_OUTPUT"
        if [[ "$IS_UNIT_TEST" == "true" && -f .coverage ]]; then
          coverage_report=coverage-unit-test-${{ github.run_id }}-$(cat /proc/sys/kernel/random/uuid)
        else
          coverage_report=none
        fi
        echo "coverage_report=$coverage_report" | tee -a "$GITHUB_OUTPUT"

        EXIT_CODE="${MAIN_EXIT_CODE:-${MAIN_CONCLUSION}}"
        if [[ "$MAIN_CONCLUSION" == "success" ]]; then
          IS_SUCCESS=true
        else
          IS_SUCCESS=false
        fi

        if [[ "$IS_SUCCESS" == "false" && "${{ inputs.is-optional }}" == "true" ]]; then
          echo "::warning::Test failed but is marked optional — treating as success."
          IS_SUCCESS=true
        fi

        LOG_BASE=$([[ "$IS_UNIT_TEST" == "true" ]] && echo "assets_dir/logs" || echo "assets_dir")
        LATEST_LOG=""
        if [[ -d "$LOG_BASE" ]]; then
          LATEST_LOG=$(find "$LOG_BASE" -name "*.log" ! -name "nccl_debug.log" -type f 2>/dev/null \
                         | xargs -r ls -t 2>/dev/null | head -1 || true)
        fi
        if [[ -n "$LATEST_LOG" ]]; then
          echo -e "\033[1;36m\n📋 ── log excerpt ───────────────────────────────────────────────────────\033[0m"
          echo -e "\033[1;36m   ${LATEST_LOG} — last 40 lines\033[0m"
          echo -e "\033[1;36m────────────────────────────────────────────────────────────────────────\033[0m"
          tail -40 "$LATEST_LOG"
          echo -e "\033[1;36m────────────────────────────────────────────────────────────────────────\033[0m\n"
        else
          echo -e "\033[33m⚠  no log file found in ${LOG_BASE}\033[0m"
        fi

        if [[ "$coverage_report" != "none" ]]; then
          echo "::group::Coverage report"
          uv run coverage report -i || true
          echo "::endgroup::"
        fi

        if [[ "$IS_SUCCESS" == "true" ]]; then
          echo -e "\033[1;32m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m║   ✅  PASSED                                                             ║\033[0m"
          echo -e "\033[1;32m║   ${{ inputs.test_case }}\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::notice title=Result::✅ ${{ inputs.test_case }} — PASSED"
          exit 0
        else
          echo -e "\033[1;31m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m║   ❌  FAILED  (exit code: ${EXIT_CODE})                                  ║\033[0m"
          echo -e "\033[1;31m║   ${{ inputs.test_case }}\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::error title=Result::❌ ${{ inputs.test_case }} — FAILED (exit $EXIT_CODE)"
          exit 1
        fi

    - name: Upload coverage
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: ${{ always() && steps.check.outputs.coverage_report != 'none' }}
      with:
        name: ${{ steps.check.outputs.coverage_report }}
        path: |
          coverage.xml
          .coverage
        include-hidden-files: true

    - name: Upload logs
      id: upload-logs
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: always()
      continue-on-error: true
      with:
        name: ${{ steps.check.outputs.logs_report }}
        path: ${{ inputs.is_unit_test == 'true' && 'assets_dir/logs' || 'assets_dir' }}
        include-hidden-files: true

    - name: Back off after log upload failure
      if: ${{ always() && steps.upload-logs.outcome == 'failure' }}
      shell: bash
      run: sleep 10

    - name: Retry log upload
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: ${{ always() && steps.upload-logs.outcome == 'failure' }}
      with:
        name: ${{ steps.check.outputs.logs_report }}-retry
        path: ${{ inputs.is_unit_test == 'true' && 'assets_dir/logs' || 'assets_dir' }}
        include-hidden-files: true
