name: "Test Template"
description: "Template for running NeMo tests in a containerized environment"

inputs:
  container-image:
    description: "Container image to use for test"
    required: true
  timeout:
    description: "Max runtime of test in minutes"
    required: false
    default: "30"
  script:
    description: "Test script to execute"
    required: false
    default: ""
  is-optional:
    description: "Pass this job on failure."
    required: false
    default: "false"
  is_unit_test:
    description: "Upload coverage as unit test"
    required: false
    default: "false"
  tag:
    description: Latest or legacy test suite
    required: true
  test_case:
    description: Test case to launch
    required: true
  model:
    description: Model to launch
    required: false
  scope:
    description: "Test scope (e.g. mr-github, mr-github-slim)"
    required: false
    default: "mr-github-slim"
  n_repeat:
    description: "Number of test repetitions"
    required: false
    default: "5"
  lightweight:
    description: "Enable lightweight mode"
    required: false
    default: "false"
  platform:
    description: "Platform to run tests on (e.g. dgx_h100, dgx_gb200)"
    required: false
    default: "dgx_h100"
  cadence:
    description: "Trigger cadence for cadence filter (pr|nightly|mergegroup). Empty disables filter."
    required: false
    default: ""
  sha:
    description: "Git ref to check out. Must match the SHA used by the upstream parse step so recipes don't diverge between scheduling and execution."
    required: false
    default: ""
  unit_testmon_mode:
    description: "Unit-test selection mode: full, enforce, or baseline."
    required: false
    default: "full"
  unit_testmon_cache_key:
    description: "Exact immutable cache key for an enforce-mode Testmon baseline."
    required: false
    default: ""
  unit_testmon_cache_dir:
    description: "Workspace-relative directory containing per-rank Testmon databases."
    required: false
    default: "assets_dir/testmon"
  unit_testmon_selected_manifest:
    description: "Workspace-relative JSON manifest written by selection and consumed by pytest."
    required: false
    default: "assets_dir/testmon/selected.json"
  unit_testmon_direct_tests:
    description: "JSON array of changed unit-test files to add to Testmon's selection."
    required: false
    default: "[]"
  unit_testmon_manifest_sha256:
    description: "Trusted platform-index checksum of the restored bucket manifest."
    required: false
    default: ""
  unit_testmon_database_checksums:
    description: "Trusted platform-index JSON array of per-rank database checksums."
    required: false
    default: "[]"
runs:
  using: "composite"
  steps:
    - name: Print node name
      shell: bash -x -e -u -o pipefail {0}
      run: echo "node_name=$NODE_NAME" | tee -a "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.sha }}

    - name: Change ownership of /home/runner/
      shell: bash
      # Tolerate vanishing `.git/objects/pack/.tmp-*` files: the prior
      # `actions/checkout` may leave a background `git gc --auto` running,
      # whose `git pack-objects` renames/deletes temp files while `chown`
      # is walking the tree. On failure, wait 5 s for gc to settle, retry,
      # then succeed unconditionally.
      run: |
        sudo chown -R $(whoami) /home/runner/ 2>/dev/null && exit 0
        sleep 5
        sudo chown -R $(whoami) /home/runner/ 2>/dev/null || true

    - name: Setup python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install uuid-runtime
      shell: bash -x -e -u -o pipefail {0}
      run: |
        for i in 1 2 3; do
          apt-get update && apt-get install -y uuid-runtime && break
          echo "apt attempt $i failed, retrying..."
          sleep 10
        done

    - name: Install uv
      shell: bash -x -e -u -o pipefail {0}
      run: |
        for i in 1 2 3; do
          curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh && break
          echo "uv install attempt $i failed, retrying..."
          sleep 10
        done

    # Restore-only is intentional: PR jobs must never mutate or publish the
    # trusted database produced by unit-testmon-baseline.yml.
    - name: Restore unit Testmon baseline
      id: restore-unit-testmon
      if: inputs.is_unit_test == 'true' && inputs.unit_testmon_mode == 'enforce' && inputs.unit_testmon_cache_key != ''
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ inputs.unit_testmon_cache_dir }}
        key: ${{ inputs.unit_testmon_cache_key }}

    - name: Resolve unit Testmon mode
      id: unit-testmon
      if: inputs.is_unit_test == 'true'
      shell: bash -e -u -o pipefail {0}
      env:
        REQUESTED_MODE: ${{ inputs.unit_testmon_mode }}
        CACHE_KEY: ${{ inputs.unit_testmon_cache_key }}
        CACHE_HIT: ${{ steps.restore-unit-testmon.outputs.cache-hit }}
        CACHE_RESTORE_OUTCOME: ${{ steps.restore-unit-testmon.outcome }}
      run: |
        case "$REQUESTED_MODE" in
          full|baseline) EFFECTIVE_MODE="$REQUESTED_MODE" ;;
          enforce)
            if [[ -n "$CACHE_KEY" \
              && "$CACHE_HIT" == "true" \
              && "$CACHE_RESTORE_OUTCOME" == "success" ]]; then
              EFFECTIVE_MODE=enforce
            else
              EFFECTIVE_MODE=full
              echo "::warning::Testmon cache was unavailable; running the full unit-test bucket."
            fi
            ;;
          *)
            echo "Unsupported unit_testmon_mode: $REQUESTED_MODE" >&2
            exit 2
            ;;
        esac
        echo "mode=$EFFECTIVE_MODE" | tee -a "$GITHUB_OUTPUT"
        {
          echo "### Unit Testmon"
          echo ""
          echo "- Requested mode: \`$REQUESTED_MODE\`"
          echo "- Effective mode: \`$EFFECTIVE_MODE\`"
          if [[ "$REQUESTED_MODE" == "enforce" ]]; then
            echo "- Exact cache hit: \`${CACHE_HIT:-false}\`"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Stage directly changed unit tests
      id: stage-unit-testmon-direct-tests
      if: inputs.is_unit_test == 'true' && steps.unit-testmon.outputs.mode == 'enforce'
      shell: bash -e -u -o pipefail {0}
      continue-on-error: true
      env:
        CACHE_DIR: ${{ inputs.unit_testmon_cache_dir }}
        DIRECT_TESTS: ${{ inputs.unit_testmon_direct_tests }}
        MANIFEST_SHA256: ${{ inputs.unit_testmon_manifest_sha256 }}
        DATABASE_CHECKSUMS: ${{ inputs.unit_testmon_database_checksums }}
      run: |
        mkdir -p "$CACHE_DIR"
        jq -e '
          if type == "array" and all(.[]; type == "string")
          then unique | sort
          else error("unit_testmon_direct_tests must be a JSON array of strings")
          end
        ' <<< "$DIRECT_TESTS" > "$CACHE_DIR/direct-tests.json.tmp"
        mv "$CACHE_DIR/direct-tests.json.tmp" "$CACHE_DIR/direct-tests.json"

        jq -n -e \
          --arg manifest_sha256 "$MANIFEST_SHA256" \
          --argjson database_checksums "$DATABASE_CHECKSUMS" '
            if ($manifest_sha256 | test("^[0-9a-f]{64}$"))
              and ($database_checksums | type == "array")
              and ($database_checksums | length > 0)
              and all($database_checksums[]; type == "string" and test("^[0-9a-f]{64}$"))
            then {
              manifest_sha256: $manifest_sha256,
              database_checksums: $database_checksums
            }
            else error("trusted Testmon index record is malformed")
            end
          ' > "$CACHE_DIR/expected-index-record.json.tmp"
        mv "$CACHE_DIR/expected-index-record.json.tmp" "$CACHE_DIR/expected-index-record.json"

    - name: Resolve final unit Testmon mode
      id: final-unit-testmon
      if: inputs.is_unit_test == 'true'
      shell: bash -e -u -o pipefail {0}
      env:
        CACHE_RESOLVED_MODE: ${{ steps.unit-testmon.outputs.mode }}
        DIRECT_TESTS_OUTCOME: ${{ steps.stage-unit-testmon-direct-tests.outcome }}
        CACHE_DIR: ${{ inputs.unit_testmon_cache_dir }}
      run: |
        EFFECTIVE_MODE="$CACHE_RESOLVED_MODE"
        if [[ "$CACHE_RESOLVED_MODE" == "enforce" \
          && "$DIRECT_TESTS_OUTCOME" != "success" ]]; then
          EFFECTIVE_MODE=full
          echo "::warning::Changed-test manifest staging failed; running the full unit-test bucket."
          {
            echo "- Final effective mode: \`full\`"
            echo "- Fallback reason: \`changed-test/index-record staging failed\`"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        # Baseline caches include their producer summary. Clear that restored
        # copy so a pre-run full fallback cannot publish stale baseline text.
        mkdir -p "$CACHE_DIR"
        : > "$CACHE_DIR/summary.md"
        echo "mode=$EFFECTIVE_MODE" | tee -a "$GITHUB_OUTPUT"

    - name: Create run-script (unit test)
      shell: bash -x -e -u -o pipefail {0}
      if: inputs.is_unit_test == 'true'
      run: |
        echo "::group::Create run-script"
        cmd=$(cat <<'RUN_TEST_EOF'
        #!/bin/bash

        export PYTHONPATH=$(pwd)
        export NEMORUN_HOME=$(pwd)
        export NCCL_DEBUG=INFO
        export PIP_DEFAULT_TIMEOUT=120
        export PIP_RETRIES=5
        export UV_HTTP_TIMEOUT=120
        uv venv .venv
        uv cache clean
        uv sync --no-cache --only-group test
        uv run python tests/test_utils/python_scripts/launch_nemo_run_workload.py \
          --scope unit-tests \
          --model unit-tests \
          --test-case "${{ inputs.test_case }}" \
          --environment dev \
          --platform ${{ inputs.platform }} \
          --tag ${{ inputs.tag }} \
          --unit-testmon-mode ${{ steps.final-unit-testmon.outputs.mode }} \
          --unit-testmon-cache-dir ${{ inputs.unit_testmon_cache_dir }} \
          --unit-testmon-selected-manifest ${{ inputs.unit_testmon_selected_manifest }} \
          --container-image ${{ inputs.container-image }} \
          --hf-home /mnt/datadrive/TestData/nemo-fw/TestData/HF_HOME

        RUN_TEST_EOF
        )
        echo "$cmd" | tee "job.sh"
        echo "::endgroup::"

    - name: Create run-script (e2e test)
      shell: bash -x -e -u -o pipefail {0}
      if: inputs.is_unit_test == 'false'
      env:
        MODEL: ${{ inputs.model }}
      run: |
        echo "::group::Create run-script"
        cmd=$(cat <<'RUN_TEST_EOF'
        #!/bin/bash
        set -euxo pipefail

        ARGS=(
          --scope ${{ inputs.scope }}
          --n-repeat ${{ inputs.n_repeat }}
        )
        if [ "${{ inputs.lightweight }}" == "true" ]; then
          ARGS+=(--enable-lightweight-mode)
        fi
        if [ -n "${{ inputs.cadence }}" ]; then
          ARGS+=(--cadence ${{ inputs.cadence }})
        fi

        export PYTHONPATH=$(pwd)
        export NEMORUN_HOME=$(pwd)
        export PIP_DEFAULT_TIMEOUT=120
        export PIP_RETRIES=5
        export UV_HTTP_TIMEOUT=120
        uv venv .venv
        uv cache clean
        uv sync --no-cache --only-group test
        uv run python tests/test_utils/python_scripts/launch_nemo_run_workload.py \
          ${ARGS[@]} \
          --model ${{ inputs.model }} \
          --test-case ${{ inputs.test_case }} \
          --environment dev \
          --platform ${{ inputs.platform }} \
          --container-image ${{ inputs.container-image }} \
          --data-dir /mnt/datadrive/TestData/megatron-lm/artifacts \
          --hf-home /mnt/datadrive/TestData/nemo-fw/TestData/HF_HOME

        RUN_TEST_EOF
        )
        echo "$cmd" | tee "job.sh"
        echo "::endgroup::"

    - name: Set timeout
      shell: bash -x -e -u -o pipefail {0}
      id: timeout_in_seconds
      run: echo "main=$(( ${{ inputs.timeout }} * 60 ))" | tee -a "$GITHUB_OUTPUT"

    - name: Pull container
      shell: bash -x -e -u -o pipefail {0}
      run: |
        echo "::group::Pull container"
        docker pull ${{ inputs.container-image }}
        echo "::endgroup::"

    - name: Run main script
      shell: bash -x -e -u -o pipefail {0}
      id: run-main-script
      run: |
        { set +x; } 2>/dev/null
        echo -e "\033[1;34m┌─ launching test ─────────────────────────────────────────────────────────┐\033[0m"
        echo -e "\033[1;34m│  test case : ${{ inputs.test_case }}\033[0m"
        echo -e "\033[1;34m│  platform  : ${{ inputs.platform }}   scope: ${{ inputs.scope }}\033[0m"
        echo -e "\033[1;34m│  container : ${{ inputs.container-image }}\033[0m"
        echo -e "\033[1;34m└──────────────────────────────────────────────────────────────────────────┘\033[0m"
        { set -x; } 2>/dev/null
        echo "::group::Logs"
        EXIT_CODE=0
        /bin/bash job.sh || EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" | tee -a "$GITHUB_OUTPUT"
        echo "::endgroup::"
        exit $EXIT_CODE

    - name: Publish unit Testmon summary
      if: always() && inputs.is_unit_test == 'true'
      shell: bash
      env:
        SUMMARY_FILE: ${{ inputs.unit_testmon_cache_dir }}/summary.md
      run: |
        if [[ -f "$SUMMARY_FILE" ]]; then
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Check result
      id: check
      shell: bash -e -u -o pipefail {0}
      if: always()
      env:
        IS_UNIT_TEST: ${{ inputs.is_unit_test == 'true' }}
        MAIN_CONCLUSION: ${{ steps.run-main-script.conclusion }}
        MAIN_EXIT_CODE: ${{ steps.run-main-script.outputs.exit_code }}
      run: |
        logs_report=logs-${{ inputs.test_case }}-${{ github.run_id }}-$(cat /proc/sys/kernel/random/uuid)
        echo "logs_report=$logs_report" | sed 's/\//-/g' | sed 's/\*/-/g' | tee -a "$GITHUB_OUTPUT"
        if [[ "$IS_UNIT_TEST" == "true" ]]; then
          coverage_report=coverage-unit-test-${{ github.run_id }}-$(cat /proc/sys/kernel/random/uuid)
        else
          coverage_report=none
        fi
        echo "coverage_report=$coverage_report" | tee -a "$GITHUB_OUTPUT"

        EXIT_CODE="${MAIN_EXIT_CODE:-${MAIN_CONCLUSION}}"
        if [[ "$MAIN_CONCLUSION" == "success" ]]; then
          IS_SUCCESS=true
        else
          IS_SUCCESS=false
        fi

        if [[ "$IS_SUCCESS" == "false" && "${{ inputs.is-optional }}" == "true" ]]; then
          echo "::warning::Test failed but is marked optional — treating as success."
          IS_SUCCESS=true
        fi

        LOG_BASE=$([[ "$IS_UNIT_TEST" == "true" ]] && echo "assets_dir/logs" || echo "assets_dir")
        LATEST_LOG=""
        if [[ -d "$LOG_BASE" ]]; then
          LATEST_LOG=$(find "$LOG_BASE" -name "*.log" ! -name "nccl_debug.log" -type f 2>/dev/null \
                         | xargs -r ls -t 2>/dev/null | head -1 || true)
        fi
        if [[ -n "$LATEST_LOG" ]]; then
          echo -e "\033[1;36m\n📋 ── log excerpt ───────────────────────────────────────────────────────\033[0m"
          echo -e "\033[1;36m   ${LATEST_LOG} — last 40 lines\033[0m"
          echo -e "\033[1;36m────────────────────────────────────────────────────────────────────────\033[0m"
          tail -40 "$LATEST_LOG"
          echo -e "\033[1;36m────────────────────────────────────────────────────────────────────────\033[0m\n"
        else
          echo -e "\033[33m⚠  no log file found in ${LOG_BASE}\033[0m"
        fi

        if [[ "$coverage_report" != "none" ]]; then
          echo "::group::Coverage report"
          uv run coverage report -i || true
          echo "::endgroup::"
        fi

        if [[ "$IS_SUCCESS" == "true" ]]; then
          echo -e "\033[1;32m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m║   ✅  PASSED                                                             ║\033[0m"
          echo -e "\033[1;32m║   ${{ inputs.test_case }}\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::notice title=Result::✅ ${{ inputs.test_case }} — PASSED"
          exit 0
        else
          echo -e "\033[1;31m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m║   ❌  FAILED  (exit code: ${EXIT_CODE})                                  ║\033[0m"
          echo -e "\033[1;31m║   ${{ inputs.test_case }}\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::error title=Result::❌ ${{ inputs.test_case }} — FAILED (exit $EXIT_CODE)"
          exit 1
        fi

    - name: Upload coverage
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: ${{ always() && steps.check.outputs.coverage_report != 'none' }}
      with:
        name: ${{ steps.check.outputs.coverage_report }}
        path: |
          coverage.xml
          .coverage
        include-hidden-files: true

    - name: Upload logs
      id: upload-logs
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: always()
      continue-on-error: true
      with:
        name: ${{ steps.check.outputs.logs_report }}
        path: ${{ inputs.is_unit_test == 'true' && 'assets_dir/logs' || 'assets_dir' }}
        include-hidden-files: true

    - name: Back off after log upload failure
      if: ${{ always() && steps.upload-logs.outcome == 'failure' }}
      shell: bash
      run: sleep 10

    - name: Retry log upload
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: ${{ always() && steps.upload-logs.outcome == 'failure' }}
      with:
        name: ${{ steps.check.outputs.logs_report }}-retry
        path: ${{ inputs.is_unit_test == 'true' && 'assets_dir/logs' || 'assets_dir' }}
        include-hidden-files: true
