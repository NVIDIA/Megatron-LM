name: Preview Fern docs
description: Generate a named Fern preview and expose its validated URL

inputs:
  preview-id:
    description: Stable preview ID within the Megatron Fern site
    required: true
  working-directory:
    description: Directory containing the Fern configuration to preview
    required: false
    default: ./fern
  token:
    description: Fern organization token
    required: true

outputs:
  url:
    description: Published preview URL
    value: ${{ steps.preview.outputs.url }}

runs:
  using: composite
  steps:
    - name: Generate preview
      id: preview
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FERN_TOKEN: ${{ inputs.token }}
        PREVIEW_ID: ${{ inputs.preview-id }}
      run: |
        set -euo pipefail
        : "${FERN_TOKEN:?Set FERN_TOKEN before generating previews.}"
        LOG_FILE=$(mktemp)
        trap 'rm -f "$LOG_FILE"' EXIT
        fern generate --docs --preview --id "$PREVIEW_ID" 2>&1 | tee "$LOG_FILE"
        URL=$(python3 "$GITHUB_WORKSPACE/.github/scripts/fern_docs_preview.py" url "$LOG_FILE")
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "### Fern preview: <$URL>" >> "$GITHUB_STEP_SUMMARY"
