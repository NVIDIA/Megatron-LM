# .github/autobot/review-config.yml
auto-review:
  enabled: true
  mode: comment
  on: status_change
  when: ready_for_review

approval:
  enabled: true
  eligible_teams:
    # GitHub includes child-team members in their parent's membership.
    - mcore-reviewers
    - mcore-engineers
    - mcore-oncall-rotation
    - mcore-automation
    - mcore-leadership
    - mcore-mlperf
    - mcore-product
