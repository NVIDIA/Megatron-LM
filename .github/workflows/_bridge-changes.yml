name: Detect Bridge-only changes
on:
  workflow_call:
    outputs:
      bridge_only:
        description: Whether the event changes files exclusively under the Bridge directories
        value: ${{ jobs.changes.outputs.bridge_only }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bridge_only: ${{ steps.diff.outputs.bridge_only || 'false' }}
    steps:
      - name: Resolve the diff base
        id: base
        if: github.event_name == 'merge_group' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            base=$MERGE_GROUP_BASE
          elif [[ "$GITHUB_REF_NAME" =~ ^pull-request/([0-9]+)$ ]]; then
            # A push to the PR mirror contains only the latest update. Compare
            # the event head against the PR's merge base, as in the Files tab.
            pr_base=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}" \
              --jq 'select(.head.sha == env.GITHUB_SHA) | .base.sha') || exit 0
            [[ "$pr_base" =~ ^[0-9a-f]{40}$ ]] || exit 0
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$pr_base...$GITHUB_SHA?per_page=1" \
              --jq '.merge_base_commit.sha') || exit 0
          elif [[ "$GITHUB_REF_NAME" == main || "$GITHUB_REF_NAME" == dev ]]; then
            base=$PUSH_BASE
          else
            exit 0
          fi
          if [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != 0000000000000000000000000000000000000000 ]]; then
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        if: steps.base.outputs.sha != ''
        continue-on-error: true
        with:
          sparse-checkout: .github/scripts

      - name: Compare the complete trees
        id: diff
        if: steps.checkout.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"; then
            bridge_only=$(bash .github/scripts/bridge_only_changes.sh "$BASE_SHA" "$GITHUB_SHA")
            echo "bridge_only=$bridge_only" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Diff base unavailable. Running normal CI."
          fi
