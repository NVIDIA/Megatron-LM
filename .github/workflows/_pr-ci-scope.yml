name: Determine PR CI scope
on:
  workflow_call:
    outputs:
      skip_builds_and_tests:
        description: Whether all files changed by this PR match the configured skip paths
        value: ${{ jobs.changes.outputs.skip_builds_and_tests }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_builds_and_tests: ${{ steps.diff.outputs.skip_builds_and_tests || 'false' }}
    steps:
      # Keep the job successful with its default output on all other events so
      # workflows depending on it continue through their normal job graph.
      - name: Resolve the PR target
        id: target
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^pull-request/([0-9]+)$ ]] || exit 0
          target=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}" \
            --jq 'select(.head.sha == env.GITHUB_SHA) | .base.sha') || exit 0
          if [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha=$target" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        if: steps.target.outputs.sha != ''
        continue-on-error: true
        with:
          sparse-checkout: .github/scripts

      - name: Compare the complete trees
        id: diff
        if: steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: bash .github/scripts/report_pr_ci_scope.sh "$TARGET_SHA"
