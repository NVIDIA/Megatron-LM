name: Determine PR CI scope
on:
  workflow_call:
    outputs:
      skip_builds_and_tests:
        description: Whether all files changed by this PR match the configured skip paths
        value: ${{ jobs.changes.outputs.skip_builds_and_tests }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_builds_and_tests: ${{ steps.diff.outcome == 'success' && steps.diff.outputs.skip_builds_and_tests || 'false' }}
    steps:
      # Other events keep the default output so their usual jobs can proceed.
      - name: Get PR info
        id: get-pr-info
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/')
        continue-on-error: true
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        if: steps.get-pr-info.outcome == 'success' && steps.get-pr-info.outputs.pr-info != ''
        continue-on-error: true
        with:
          sparse-checkout: .github/actions/pr-changed-files
          persist-credentials: false

      - name: Determine PR CI scope
        id: diff
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/pr-changed-files
        with:
          pr-info: ${{ steps.get-pr-info.outputs.pr-info }}
          tested-sha: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).merge_commit_sha }}
