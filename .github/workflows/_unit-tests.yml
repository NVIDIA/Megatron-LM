name: Unit tests

on:
  workflow_call:
    inputs:
      buckets:
        description: JSON-encoded recipe bucket list
        type: string
        required: true
      platform:
        type: string
        default: dgx_h100
      runner:
        description: JSON-encoded runner label or object with group and labels
        type: string
        required: true
      selection-runner:
        description: JSON-encoded CPU runner with the container's native architecture; empty disables CPU collection
        type: string
        default: ""
      container-image:
        type: string
        required: true
      sha:
        type: string
        required: true
      unit_testmon_mode:
        type: string
        default: full
      unit_testmon_target_branch:
        type: string
        default: ""
      unit_test_pr_files_artifact_id:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  bucket:
    name: ${{ matrix.bucket }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.buckets) }}
    uses: ./.github/workflows/_unit-test-bucket.yml
    with:
      bucket: ${{ matrix.bucket }}
      timeout: ${{ matrix.timeout || 30 }}
      platform: ${{ inputs.platform }}
      runner: ${{ inputs.runner }}
      selection-runner: ${{ inputs.selection-runner }}
      container-image: ${{ inputs.container-image }}
      sha: ${{ inputs.sha }}
      unit_testmon_mode: ${{ inputs.unit_testmon_mode }}
      unit_testmon_target_branch: ${{ inputs.unit_testmon_target_branch }}
      unit_test_pr_files_artifact_id: ${{ inputs.unit_test_pr_files_artifact_id }}
