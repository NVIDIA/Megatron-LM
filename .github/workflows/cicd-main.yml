# Temporary cache export for PR #8994. Do not merge this workflow replacement.
name: CICD Megatron-LM
on:
  push:
    branches:
      - "pull-request/8994"
  workflow_dispatch:

concurrency:
  group: testmon-cache-export-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TESTMON_CACHE_GENERATION: "41784707601-1"

jobs:
  list-testmon-caches:
    if: github.repository == 'NVIDIA/Megatron-LM'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      keys: ${{ steps.list.outputs.keys }}
      source_sha: ${{ steps.list.outputs.source_sha }}
    steps:
      - name: Find the exact main cache generation
        id: list
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          GENERATION: ${{ env.TESTMON_CACHE_GENERATION }}
        with:
          script: |
            const generation = process.env.GENERATION;
            if (!/^[1-9][0-9]*-[1-9][0-9]*$/.test(generation)) {
              throw new Error('Expected cache generation RUN_ID-ATTEMPT');
            }
            const [runId, attempt] = generation.split('-');
            const {data: run} = await github.rest.actions.getWorkflowRunAttempt({
              ...context.repo, run_id: Number(runId), attempt_number: Number(attempt)
            });
            if (run.head_branch !== 'main') throw new Error('Expected a main baseline run');
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, ref: 'refs/heads/main', per_page: 100
            });
            const keys = caches.map(cache => cache.key).filter(key =>
              /^unit-testmon-v1-main-dgx_(h100|gb200)-[0-9a-f]{16}-/.test(key)
              && key.endsWith(`-${generation}`)
            ).sort();
            if (!keys.length) throw new Error('No caches remain for this generation');
            core.setOutput('keys', JSON.stringify(keys));
            core.setOutput('source_sha', run.head_sha);
            core.info(`Exporting ${keys.length} caches from ${run.head_sha}`);

  export-testmon-caches:
    needs: list-testmon-caches
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        key: ${{ fromJSON(needs.list-testmon-caches.outputs.keys) }}
    steps:
      - name: Match gzip cache version
        id: compression
        shell: bash
        run: |
          set -euo pipefail
          cache_bin=$(mktemp -d "$RUNNER_TEMP/testmon-gzip.XXXXXX")
          printf '#!/bin/sh\nexit 1\n' > "$cache_bin/zstd"
          chmod +x "$cache_bin/zstd"
          printf 'path=%s:%s\n' "$cache_bin" "$PATH" >> "$GITHUB_OUTPUT"
      - name: Restore exact cache generation
        id: restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        env:
          PATH: ${{ steps.compression.outputs.path }}
        with:
          path: assets_dir/testmon
          key: ${{ matrix.key }}
          fail-on-cache-miss: true
      - name: Verify identity and database integrity
        env:
          GENERATION: ${{ env.TESTMON_CACHE_GENERATION }}
          SOURCE_SHA: ${{ needs.list-testmon-caches.outputs.source_sha }}
          EXPECTED_KEY: ${{ matrix.key }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import hashlib, json, os, sqlite3
          from contextlib import closing
          from pathlib import Path
          root = Path('assets_dir/testmon')
          assert os.environ['EXPECTED_KEY'] == os.environ['MATCHED_KEY']
          m = json.loads((root / 'manifest.json').read_text())
          assert m['generation'] == os.environ['GENERATION']
          assert m['source_sha'] == os.environ['SOURCE_SHA']
          for phase in ('prod', 'experimental'):
              db = root / phase / '.testmondata'
              meta = json.loads((db.parent / 'metadata.json').read_text())
              assert meta['complete'] is True
              assert meta['database_sha256'] == hashlib.sha256(db.read_bytes()).hexdigest()
              wal = db.with_name(db.name + '-wal')
              assert not wal.exists() or wal.stat().st_size == 0
              with closing(sqlite3.connect(db.resolve().as_uri() + '?mode=ro&immutable=1', uri=True)) as c:
                  assert c.execute('PRAGMA user_version').fetchone() == (14,)
                  assert c.execute('PRAGMA quick_check').fetchall() == [('ok',)]
          print(json.dumps({'key': os.environ['EXPECTED_KEY'], 'manifest': m}))
          CHECK
      - name: Export databases and manifests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: export-${{ matrix.key }}
          path: assets_dir/testmon
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
