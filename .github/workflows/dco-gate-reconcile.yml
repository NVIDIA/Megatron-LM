name: DCO gate reconcile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: dco-gate-reconcile
  cancel-in-progress: false

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  # `dco-gate.yml` only fires while a DCO App check run completes. A head whose verdict
  # completed before the gate existed — or whose webhook was dropped — never sees another
  # event, so the required `DCO gate` check would never be published for it. This sweep
  # publishes the gate for exactly those heads and touches no head that already has one.
  reconcile-dco-gates:
    name: Publish missing DCO gates
    if: github.repository == 'NVIDIA/Megatron-LM'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected default branch scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Reconcile DCO gates
        env:
          DCO_GATE_MODE: reconcile
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dco_gate.py
