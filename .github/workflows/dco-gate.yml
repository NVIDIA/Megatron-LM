name: DCO gate publisher

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA whose trusted DCO result should be reconciled
        required: true
        type: string

concurrency:
  group: dco-gate-${{ github.event.check_run.head_sha || inputs.sha }}
  cancel-in-progress: false

permissions:
  checks: write
  contents: read

jobs:
  mirror-dco:
    name: Mirror trusted DCO result
    if: |
      github.repository == 'NVIDIA/Megatron-LM'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.check_run.name == 'DCO'
          && github.event.check_run.app.slug == 'dco'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected default branch scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Publish DCO gate
        env:
          DCO_GATE_SHA: ${{ inputs.sha || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dco_gate.py
