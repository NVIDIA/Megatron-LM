# Validates Fern docs configuration on pull requests.

name: Fern docs (check)

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/actions/setup-fern/**'
      - '.github/workflows/fern-docs-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check nightly navigation is up to date
        run: |
          python -m pip install --no-cache-dir PyYAML
          python docs/fern/scripts/fern_nav.py generate --check

      - name: Checkout frozen version content
        run: python3 docs/fern/scripts/fern_versions.py extract-content

      - name: Set up Fern CLI
        uses: ./.github/actions/setup-fern

      - name: Validate Fern configuration
        working-directory: ./docs/fern
        run: fern check
