# Workflow 1 of 2 for Fern doc previews.
#
# Collects the docs/ sources and PR metadata from the (possibly untrusted) PR
# branch and uploads them as an artifact. The whole docs/ tree is uploaded
# because the Fern navigation in docs/fern/ points at pages elsewhere in docs/.
#
# This workflow holds no secrets, and that is deliberate: it runs on fork PRs
# via the regular pull_request trigger, so there must be no credential for PR
# content to reach. Keep it that way. Do not add secrets or switch to
# pull_request_target.
#
# The companion workflow (fern-docs-preview-comment.yml) picks up the artifact,
# builds the preview with DOCS_FERN_PREVIEW_TOKEN, and posts the PR comment.

name: "Preview Fern Docs: Build"

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/fern-docs-preview-build.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p preview-metadata
          echo "$PR_NUMBER" > preview-metadata/pr_number
          echo "$HEAD_REF" > preview-metadata/head_ref
          git diff --name-only "origin/${BASE_REF}...HEAD" -- '*.mdx' > preview-metadata/changed_mdx_files 2>/dev/null || true

      - name: Upload docs sources and metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fern-preview
          path: |
            docs/
            preview-metadata/
          retention-days: 1
