# Follow copy-pr-bot's synchronized branches, including contributions from forks.
# This workflow never receives Fern credentials. The workflow_run consumer on
# main independently resolves the PR and validates its immutable source revision.
name: Fern docs (preview request)

on:
  push:
    branches:
      - 'pull-request/[0-9]+'
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/actions/setup-fern/**'
      - '.github/actions/preview-fern/**'
      - '.github/scripts/fern_docs_preview.py'
      - '.github/scripts/test_fern_docs_preview.py'
      - '.github/workflows/fern-docs-preview*.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fern-preview-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-flight:
    if: github.repository == 'NVIDIA/Megatron-LM'
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@037094bcc9138c72bc125418e6e3653f9e1c4160 # v1.11.0
    with:
      workflow_ref: 037094bcc9138c72bc125418e6e3653f9e1c4160 # pragma: allowlist secret
