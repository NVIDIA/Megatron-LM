# Opens a draft PR that adds a new release to the Fern docs version selector.
#
# Runs when a core_vX.Y.Z GitHub release is published (prereleases are skipped),
# or manually with an explicit version. The PR adds docs/fern/versions/vX.Y.Z.yml
# and updates docs/fern/docs.yml; merging it and then publishing the docs makes
# the new version live.

name: Fern docs (version bump)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to add, for example 0.21.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fern-docs-version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: |
      github.repository == 'NVIDIA/Megatron-LM'
      && (github.event_name == 'workflow_dispatch'
          || (!github.event.release.prerelease
              && startsWith(github.event.release.tag_name, 'core_v')))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          VERSION="${INPUT_VERSION#core_v}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Skipping: '$INPUT_VERSION' is not a final X.Y.Z release."
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get app token
        if: steps.version.outputs.version
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        if: steps.version.outputs.version
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Add version to Fern docs
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --depth=1 origin "refs/tags/core_v${VERSION}:refs/tags/core_v${VERSION}" || true
          python3 docs/fern/scripts/fern_versions.py bump "$VERSION"

      - name: Open draft PR
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain docs/fern)" ]; then
            echo "Docs already list ${VERSION}; nothing to do."
            exit 0
          fi
          BRANCH="docs/fern-version-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/fern
          git commit -s -m "docs: add ${VERSION} to Fern version selector"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR for $BRANCH already open."
            exit 0
          fi
          gh pr create --draft --base main --head "$BRANCH" \
            --title "docs: add ${VERSION} to Fern version selector" \
            --body "Adds \`docs/fern/versions/v${VERSION}.yml\` and marks ${VERSION} as the latest version in \`docs/fern/docs.yml\`. Generated by the \`fern-docs-version-bump\` workflow after the \`core_v${VERSION}\` release."
