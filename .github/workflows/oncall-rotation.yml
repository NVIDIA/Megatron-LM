name: Oncall Rotation

on:
  schedule:
    # Runs at 09:00 UTC every Wednesday
    - cron: "0 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate-schedule:
    if: github.repository == 'NVIDIA/Megatron-LM' && github.ref == 'refs/heads/main'
    environment: oncall-rotation
    concurrency:
      group: oncall-rotation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Create schedule publishing token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}
          permission-contents: write

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Rotate Schedule
        env:
          GH_TOKEN: ${{ secrets.NVIDIA_MCORE_ONCALL_TOKEN }}
          SLACK_TOKEN: ${{ secrets.ONCALL_SLACK_TOKEN }}
        run: |
          pip install --no-cache-dir "uv<0.9.29"
          uv venv .venv
          uv cache clean
          uv sync --no-cache
          uv run --with slack-sdk python .github/scripts/oncall_manager.py rotate

      - name: Publish the updated schedule
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        shell: bash
        run: |
          schedule=.github/oncall_schedule.json
          if git diff --quiet HEAD -- "$schedule"; then
            exit 0
          fi
          original_blob=$(git rev-parse "HEAD:$schedule")
          jq -n --rawfile schedule "$schedule" --arg sha "$original_blob" \
            '{branch: "main", message: "chore: rotate oncall schedule", sha: $sha, content: ($schedule | @base64)}' |
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$schedule" --input - --jq '.commit.sha'
