name: Populate CI build caches
run-name: Populate CI build caches from main

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate-source:
    name: Validate cache source
    if: github.repository == 'NVIDIA/Megatron-LM'
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$SOURCE_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from the main branch."
            exit 1
          fi

  populate-build-cache:
    name: Populate build caches
    needs: validate-source
    if: github.repository == 'NVIDIA/Megatron-LM'
    uses: ./.github/workflows/_build_ci_container.yml
    with:
      is-maintainer: true
      source-sha: ${{ github.sha }}
      lts: false
      timeout-minutes: 120
      verify-cache: true
