name: Re-review Reminder

on:
  pull_request_target:
    types: [review_requested]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-reviewer:
    if: >-
      github.repository == 'NVIDIA/Megatron-LM' &&
      github.event.requested_reviewer != null
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is privileged, so execute only code from the trusted base commit.
      - name: Checkout trusted repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir requests slack-sdk

      - name: Notify re-requested reviewer
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          SLACK_TOKEN: ${{ secrets.ISSUE_BOT_SLACK_TOKEN }}
        run: python .github/scripts/re_review_reminder.py
