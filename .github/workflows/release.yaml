name: "Build, validate, and release Megatron-Core"

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      - "deploy-release/*"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      release-ref:
        description: Commit SHA to release (must be a full 40-char SHA)
        required: true
        type: string
      dry-run:
        description: Compute the release without publishing wheels, a GitHub release, or a Sphinx archive.
        required: true
        default: true
        type: boolean
      publish-target:
        description: Package index for a real upload; dry-run always disables uploads
        required: true
        type: choice
        default: pypi
        options:
          - pypi
          - testpypi
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean
      generate-changelog:
        description: Generate changelog
        required: false
        default: true
        type: boolean
      publish-docs:
        description: Build the Sphinx archive for a pre-Fern release SHA and publish it outside dry runs.
        required: false
        default: false
        type: boolean
      version-bump-branch:
        description: Branch for version bump
        required: true
        type: string
      gh-release-from-tag:
        description: Tag of previous release for changelog builder
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-ref is a commit SHA
        env:
          RELEASE_REF: ${{ inputs.release-ref || github.sha }}
          IS_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && inputs.publish-target == 'pypi' }}
        run: |
          if ! echo "$RELEASE_REF" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::release-ref must be a full 40-character commit SHA, not a branch name."
            exit 1
          fi
          if [[ "$IS_PRODUCTION" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production publishing must run from main; select the release commit with release-ref."
            exit 1
          fi

  release-workflow-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest==9.1.1' 'PyYAML==6.0.3' packaging
      - run: python -m pytest .github/scripts/test_release_workflow.py

  pre-flight:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@2eee849aec3da7b625a798188a0e1ba603e448d8
    with:
      workflow_ref: 2eee849aec3da7b625a798188a0e1ba603e448d8 # pragma: allowlist secret
    if: github.repository == 'NVIDIA/Megatron-LM' && github.event_name != 'workflow_dispatch'

  bump:
    needs: [pre-flight, validate-inputs, release-workflow-tests]
    if: |
      !cancelled() && !failure()
      && github.repository == 'NVIDIA/Megatron-LM'
      && !(needs.pre-flight.outputs.docs_only == 'true'
           || needs.pre-flight.outputs.is_merge_group == 'true'
           || needs.pre-flight.outputs.is_deployment_workflow == 'true')
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_bump.yml@2eee849aec3da7b625a798188a0e1ba603e448d8
    with:
      release-branch-pattern: "core_[rv][0-9]*.[0-9]*.[0-9]*"
      release-ref: ${{ inputs.release-ref || github.sha }}
      validate-only: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-target == 'testpypi' }}
      dry-run: ${{ inputs.dry-run || inputs.publish-target == 'testpypi' }}
      version-bump-branch: ${{ inputs.version-bump-branch || github.ref_name }}
      restrict-to-admins: true
      app-id: ${{ vars.BOT_ID }}
      library-name: Megatron Core
      bump-targets: |
        [
          {"python-package": "megatron.core", "src-dir": ""},
          {"python-package": "megatron_fsdp", "src-dir": "megatron/core/distributed/fsdp/src/"}
        ]
    secrets: inherit  # pragma: allowlist secret

  build-test-wheels:
    needs: [pre-flight, bump]
    if: |
      !cancelled() && !failure() && needs.bump.result == 'success'
      && github.repository == 'NVIDIA/Megatron-LM'
      && (
        github.event_name == 'workflow_dispatch'
        || !(needs.pre-flight.outputs.docs_only == 'true'
             || needs.pre-flight.outputs.is_deployment_workflow == 'true')
      )
    permissions:
      contents: read
    uses: ./.github/workflows/_build_test_wheel.yml
    with:
      ref: ${{ inputs.release-ref || github.sha }}
      dry-run: ${{ inputs.dry-run || inputs.publish-target == 'testpypi' }}

  publish-wheels:
    needs: [bump, build-test-wheels]
    if: >-
      !cancelled() && !failure()
      && needs.bump.result == 'success' && needs.build-test-wheels.result == 'success'
      && github.repository == 'NVIDIA/Megatron-LM'
      && github.event_name == 'workflow_dispatch' && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: ${{ inputs.publish-target }}
      url: https://${{ inputs.publish-target == 'testpypi' && 'test.' || '' }}pypi.org/p/${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package: [megatron-core, megatron-fsdp]
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: wheels-${{ matrix.package }}-*-${{ inputs.publish-target == 'testpypi' && 'dry-run' || 'release' }}
          path: dist/
          merge-multiple: true

      - name: Publish with a trusted publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.publish-target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true

  verify-published-wheels:
    needs: [publish-wheels]
    if: ${{ !cancelled() && !failure() && needs.publish-wheels.result == 'success' }}
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: megatron-core
            platform: amd64
            module: megatron.core
          - package: megatron-core
            platform: arm64
            module: megatron.core
          - package: megatron-fsdp
            platform: amd64
            module: megatron_fsdp
    steps:
      - name: Checkout verification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download expected distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: wheels-${{ matrix.package }}-*-${{ inputs.publish-target == 'testpypi' && 'dry-run' || 'release' }}
          path: dist/
          merge-multiple: true

      - name: Verify uploaded files and attestations
        id: verify
        env:
          INDEX: ${{ inputs.publish-target }}
          PACKAGE: ${{ matrix.package }}
        run: |
          python -m pip install 'pypi-attestations==0.0.32'
          python .github/scripts/verify_pypi_release.py --index "$INDEX" --package "$PACKAGE" --dist-dir dist

      - name: Install published wheel and check its version
        working-directory: ${{ runner.temp }}
        env:
          INDEX_URL: https://${{ inputs.publish-target == 'testpypi' && 'test.' || '' }}pypi.org/simple/
          PACKAGE: ${{ matrix.package }}
          MODULE: ${{ matrix.module }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          python -m venv published-wheel
          source published-wheel/bin/activate
          python -m pip install --index-url https://pypi.org/simple/ --find-links "$GITHUB_WORKSPACE/dist" "$PACKAGE==$VERSION"
          python -m pip uninstall -y "$PACKAGE"
          python -m pip install --no-cache-dir --no-deps --only-binary=:all: --index-url "$INDEX_URL" "$PACKAGE==$VERSION"
          python -c 'import importlib, os; actual = importlib.import_module(os.environ["MODULE"]).__version__; assert actual == os.environ["VERSION"], (actual, os.environ["VERSION"])'

  finalize:
    needs: [bump, build-test-wheels, publish-wheels, verify-published-wheels]
    if: |
      github.repository == 'NVIDIA/Megatron-LM'
      && !cancelled() && !failure()
      && needs.bump.result == 'success'
      && needs.build-test-wheels.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.dry-run
          || needs.verify-published-wheels.result == 'success')
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_finalize.yml@2eee849aec3da7b625a798188a0e1ba603e448d8
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      release-version: ${{ needs.bump.outputs.release-version }}
      library-name: Megatron Core
      pypi-name: megatron-core
      validate-only: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-target == 'testpypi' }}
      dry-run: ${{ inputs.dry-run || inputs.publish-target == 'testpypi' }}
      create-gh-release: ${{ github.event_name != 'workflow_dispatch' || inputs.create-gh-release == true }}
      gh-release-tag-prefix: core_
      gh-release-use-changelog-builder: ${{ inputs.generate-changelog || false }}
      gh-release-from-tag: ${{ inputs.gh-release-from-tag || '' }}
      publish-docs: ${{ github.event_name == 'workflow_dispatch' && inputs.publish-target != 'testpypi' && inputs.publish-docs }}
      docs-target-path: megatron-core/developer-guide
      publish-as-latest: true
      run-on-version-tag-only: ${{ github.ref_name != 'main' }}
      app-id: ${{ vars.BOT_ID }}
    secrets: inherit  # pragma: allowlist secret

  release-summary:
    needs: [validate-inputs, release-workflow-tests, pre-flight, bump, build-test-wheels, publish-wheels, verify-published-wheels, finalize]
    if: github.repository == 'NVIDIA/Megatron-LM' && !cancelled()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
        run: |
          UNSUCCESSFUL=$(jq -r --arg require_upload "$REQUIRE_UPLOAD" '
            to_entries[] | select(
              .value.result == "failure" or .value.result == "cancelled" or
              ($require_upload == "true" and .value.result != "success" and
                (.key == "publish-wheels" or .key == "verify-published-wheels" or .key == "finalize"))
            ) | .key' <<< "$NEEDS_JSON")
          if [[ -n "$UNSUCCESSFUL" ]]; then
            echo "::error::Required release jobs did not succeed:"
            printf '%s\n' "$UNSUCCESSFUL"
            exit 1
          fi
          echo "All required release jobs completed successfully"
