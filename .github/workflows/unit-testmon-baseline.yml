name: Unit Testmon Baseline

on:
  workflow_run:
    workflows: ["CICD Megatron-LM"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: unit-testmon-baseline-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'NVIDIA/Megatron-LM'
      && (
        (
          github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'schedule'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == github.event.repository.default_branch
        )
        || (
          github.event_name == 'workflow_dispatch'
          && github.ref_name == github.event.repository.default_branch
        )
      )
    outputs:
      producer_sha: ${{ steps.producer.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve producer
        id: producer
        shell: bash -e -u -o pipefail {0}
        env:
          PRODUCER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$PRODUCER_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${PRODUCER_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout producer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.producer.outputs.sha }}

      - name: Build baseline matrix
        id: matrix
        shell: bash -e -u -o pipefail {0}
        env:
          PRODUCER_SHA: ${{ steps.producer.outputs.sha }}
          ENABLE_GB200_TESTING: ${{ vars.ENABLE_GB200_TESTING }}
        run: |
          H100=$(yq -o json '[.products[].test_case[]]' \
            tests/test_utils/recipes/h100/unit-tests.yaml | jq -c \
              --arg sha "$PRODUCER_SHA" '
                map({
                  bucket: ., runner: "nvidia-ci-aws-gpu-x8",
                  recipe_platform: "dgx_h100",
                  image: ("766267172432.dkr.ecr.us-east-1.amazonaws.com/megatron-lm:" + $sha + "-aws-h100")
                }) | sort_by(.bucket)
              ')

          GB200='[]'
          if [[ "$ENABLE_GB200_TESTING" == "true" ]]; then
            GB200=$(yq -o json '[.products[].test_case[]]' \
              tests/test_utils/recipes/gb200/unit-tests.yaml | jq -c \
                --arg sha "$PRODUCER_SHA" '
                  map({
                    bucket: ., runner: "nvidia-ci-aws-use2-gpu-x4",
                    recipe_platform: "dgx_gb200",
                    image: ("766267172432.dkr.ecr.us-east-2.amazonaws.com/megatron-lm:" + $sha + "-gb-gpu")
                  }) | sort_by(.bucket)
                ')
          fi

          MATRIX=$(jq -cn --argjson h100 "$H100" --argjson gb200 "$GB200" '$h100 + $gb200')
          jq -e 'length > 0 and all(.[]; (.bucket | type) == "string" and (.bucket | length) > 0)' \
            <<< "$MATRIX" >/dev/null
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  baseline:
    name: ${{ matrix.recipe_platform }} baseline - ${{ matrix.bucket }}
    needs: [prepare]
    if: needs.prepare.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout producer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.producer_sha }}

      - name: Generate and cache Testmon baseline
        uses: ./.github/actions
        with:
          test_case: ${{ matrix.bucket }}
          tag: latest
          timeout: "45"
          is_unit_test: "true"
          container-image: ${{ matrix.image }}
          platform: ${{ matrix.recipe_platform }}
          sha: ${{ needs.prepare.outputs.producer_sha }}
          unit_testmon_mode: baseline
