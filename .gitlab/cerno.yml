# Megatron-LM configuration for Cerno.

gitlab:
  project_id: 19378
  repo_name: ADLR/megatron-lm

modules:
  megatron_lm:
    build_module: megatron-lm
    display_name: Megatron-LM
    grafana_dashboard_url: https://grafana.nvidia.com/d/ccel3m7ntzqkke/megatron-lm-ci
    channel_id_env: MCORE_SLACK_CHANNEL_ID
    reconcile_proposal: true
    team_key: MCORE
    project_template: "MCore CI Testing"
    enable_linear_open: true
    enable_linear_modify: true
    enable_linear_close: true
