.linear_reconcile_rules:
  rules:
    - if: >-
        ($CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == "main") &&
        $FUNCTIONAL_TEST == "yes" &&
        $RUN_LINEAR_STATUS == "True"
      when: always
    - when: never

.linear_triage_job:
  stage: triage
  image: ${UTILITY_IMAGE}:${CI_PIPELINE_ID}
  tags:
    - arch/amd64
    - env/prod
    - origin/jet-fleet
    - owner/jet-core
    - purpose/utility
    - team/megatron

triage:linear_reconcile:
  extends: [.linear_triage_job, .linear_reconcile_rules]
  needs:
    - job: functional:x_notify
      artifacts: true
  script:
    - >-
      cerno-linear status
      --config "${CERNO_CONFIG}"
      --build-module-regex '^megatron-lm$'
      --output linear_status_report.json
    - >-
      cerno-linear reconcile
      --failure-buckets failure_buckets.json
      --linear-report linear_status_report.json
      --pipeline-summaries pipeline_summaries.json
      --output linear_action_plan.json
  artifacts:
    when: always
    paths:
      - linear_status_report.json
      - linear_action_plan.json
      - inference_metrics.json

triage:linear_write:
  extends: [.linear_triage_job]
  needs:
    - job: triage:linear_reconcile
      artifacts: true
  allow_failure: true
  script:
    - >-
      cerno-linear write
      --config "${CERNO_CONFIG}"
      --plan linear_action_plan.json
      --output linear_action_plan_post.json
  artifacts:
    when: always
    paths:
      - linear_action_plan.json
      - linear_action_plan_post.json
      - linear_status_report.json
  rules:
    - if: >-
        ($CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == "main") &&
        $FUNCTIONAL_TEST == "yes" &&
        $RUN_LINEAR_STATUS == "True" &&
        $RUN_LINEAR_WRITE == "True"
      when: always
    - when: never

triage:linear_overview:
  extends: [.linear_triage_job]
  needs:
    - job: functional:x_notify
      artifacts: true
    - job: triage:linear_write
      artifacts: true
  allow_failure: true
  script:
    - >-
      cerno-linear overview
      --config "${CERNO_CONFIG}"
      --pipeline-summaries pipeline_summaries.json
      --failure-buckets failure_buckets.json
      --linear-report linear_status_report.json
      --plan linear_action_plan_post.json
  rules:
    - if: >-
        ($CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == "main") &&
        $FUNCTIONAL_TEST == "yes" &&
        $RUN_LINEAR_STATUS == "True" &&
        $RUN_LINEAR_WRITE == "True"
      when: always
    - when: never

triage:slack_linear_followup:
  extends: [.linear_triage_job]
  needs:
    - job: functional:x_notify
      artifacts: true
    - job: triage:linear_write
      artifacts: true
    - job: triage:linear_overview
      artifacts: false
  allow_failure: true
  script:
    - >-
      cerno-notify
      --pipeline-summary slack_notification.json
      --linear-plan linear_action_plan_post.json
      --slack-bot-token "${MCORE_SLACK_BOT_TOKEN:-${ALERTMANAGER_TOKEN}}"
      --slack-channel-id "${MCORE_SLACK_CHANNEL_ID}"
    - |
      THREAD_TIMESTAMP="$(python -c 'import json; print(json.load(open("slack_notification.json")).get("thread_timestamp") or "")')"
      if [[ -z "${THREAD_TIMESTAMP}" ]]; then
        echo "No Slack thread timestamp; skipping detailed triage follow-ups."
      else
        cerno-notify \
          --config "${CERNO_CONFIG}" \
          --module megatron_lm \
          --only-followup \
          --thread-ts "${THREAD_TIMESTAMP}" \
          --failure-buckets failure_buckets.json \
          --linear-report linear_status_report.json \
          --action-plan linear_action_plan_post.json \
          --slack-bot-token "${MCORE_SLACK_BOT_TOKEN:-${ALERTMANAGER_TOKEN}}"
      fi
  rules:
    # Post the applied Linear actions under the functional-test notification.
    - if: >-
        ($CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == "main") &&
        $FUNCTIONAL_TEST == "yes" &&
        $RUN_LINEAR_STATUS == "True" &&
        $RUN_LINEAR_WRITE == "True"
      when: always
    - when: never
