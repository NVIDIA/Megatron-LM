# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: megatron.docs.buildwithfern.com/megatron/developer-guide
    custom-domain: docs.nvidia.com/megatron/developer-guide
    multi-source: true

title: Megatron Core

global-theme: nvidia

navbar-links:
  - type: github
    value: https://github.com/NVIDIA/Megatron-LM

logo:
  right-text: Megatron Core

versions:
  - display-name: "0.20.0 (latest)"
    path: ../index.yml
    slug: latest
  - display-name: "nightly"
    ref: <branch name>
    slug: nightly
  - display-name: "Archives"
    path: versions/archives.yml
    slug: archives
