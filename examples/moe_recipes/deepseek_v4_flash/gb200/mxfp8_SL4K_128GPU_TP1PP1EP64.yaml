DEPENDENCIES:
  pytorch_base_image: nvcr.io/nvidia/pytorch:26.09-py3
  dockerfile: |
    # Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
    # Build with an ARM64 builder for GB200/GB300.
    FROM nvcr.io/nvidia/pytorch:26.09-py3
    ENV PIP_CONSTRAINT=""
    RUN bash -euxo pipefail <<'BUILD'
    export PIP_CONSTRAINT=""
    export NVTE_FRAMEWORK=pytorch NVTE_CUDA_ARCHS="100a;103a" NVTE_BUILD_THREADS_PER_JOB=4 MAX_JOBS=16
    export CUDA_HOME=/usr/local/cuda
    export LIBRARY_PATH=/usr/local/cuda/lib64/stubs${LIBRARY_PATH:+:$LIBRARY_PATH}
    # Remove unused base-image packages with incompatible CUTLASS pins.
    python -m pip uninstall -y flash-attn-4 quack-kernels transformer-engine transformer-engine-torch transformer-engine-cu13 transformer-engine-cu12
    python -m pip install --no-cache-dir uv ninja cmake pybind11 wheel packaging pyyaml absl-py einops \
        omegaconf sentencepiece tiktoken datasets wandb tensorstore pytest pytest-mock 'pydantic<2.14' 'nvidia-cuda-cupti==13.4.92' \
        'nvidia-cudnn-frontend[cutedsl]==1.29.0' 'nvidia-cutlass-dsl[cu13]==4.8.0'
    python -m pip install --no-build-isolation --no-cache-dir \
        git+https://github.com/NVIDIA/TransformerEngine.git@b021980343e33fdd5b091f95fd13f82e05d581af
    python -m pip install --no-build-isolation --no-cache-dir \
        git+https://github.com/NVIDIA-NeMo/Emerging-Optimizers.git@b309e2f01cda75dc96a6dc1a2355a7b3b64b5e16
    TORCH_CUDA_ARCH_LIST="10.0;10.3" python -m pip install --no-build-isolation --no-cache-dir \
        git+https://github.com/Dao-AILab/fast-hadamard-transform.git@f134af63deb2df17e1171a9ec1ea4a7d8604d5ca
    mok_dir=$(mktemp -d)
    git -C "$mok_dir" init
    git -C "$mok_dir" remote add origin https://github.com/QiZhangNV/mixture-of-kittens.git
    git -C "$mok_dir" fetch --depth 1 origin 7a8cfb7fdd96a1cfba506caf4756c6c86073399a
    git -C "$mok_dir" checkout --detach FETCH_HEAD
    bash "$mok_dir/scripts/prepare_thunderkittens.sh"
    MOK_ARCH=ALL MOK_NVCC=/usr/local/cuda/bin/nvcc python -m pip install --no-build-isolation --no-cache-dir "$mok_dir"
    rm -rf "$mok_dir"
    python -m pip check
    python - <<'CHECK'
    import importlib.metadata as m, json
    from pathlib import Path
    versions={}
    for name in ['torch','transformer-engine','nvidia-cudnn-frontend','emerging-optimizers','mixture-of-kittens']:
        versions[name]=m.version(name)
        print(name, versions[name])
    Path('/opt/dsv4-environment.json').write_text(json.dumps(versions,indent=2))
    CHECK
    BUILD
    WORKDIR /workspace/Megatron-LM
ENTRY:
  script: pretrain_hybrid.py
ENV_VARS:
  TORCH_NCCL_AVOID_RECORD_STREAMS: '0'
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,graph_capture_record_stream_reuse:True
  NCCL_NVLS_ENABLE: '0'
  NVTE_FUSED_ATTN: '1'
  NVTE_NORM_FWD_USE_CUDNN: '1'
  NVTE_NORM_BWD_USE_CUDNN: '1'
  PYTHONWARNINGS: ignore
  NCCL_DEBUG: VERSION
  NCCL_GRAPH_REGISTER: '0'
  CUDA_DEVICE_MAX_CONNECTIONS: '32'
ARGS:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: unsloth/DeepSeek-V3
  hidden_size: 4096
  num_attention_heads: 64
  kv_channels: 512
  max_position_embeddings: 4096
  normalization: RMSNorm
  norm_epsilon: 1e-6
  swiglu: true
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  position_embedding_type: rope
  rotary_base: 10000
  make_vocab_size_divisible_by: 3232
  multi_latent_attention: true
  q_lora_rank: 1024
  qk_pos_emb_head_dim: 64
  v_head_dim: 512
  rotary_scaling_factor: 4
  mscale: 1.0
  mscale_all_dim: 1.0
  qk_layernorm: true
  original_max_position_embeddings: 65536
  experimental_attention_variant: dsv4_hybrid
  csa_window_size: 128
  csa_compress_ratios: ([0,0,4]+[128,4]*20+[0])
  csa_compress_rotary_base: 40000
  dsa_indexer_n_heads: 64
  dsa_indexer_head_dim: 128
  dsa_indexer_topk: 512
  dsa_indexer_loss_coeff: 1e-2
  dsa_indexer_use_sparse_loss: true
  num_experts: 256
  moe_ffn_hidden_size: 2048
  moe_shared_expert_intermediate_size: 2048
  moe_router_load_balancing_type: seq_aux_loss
  moe_router_topk: 6
  moe_aux_loss_coeff: 1e-4
  moe_router_topk_scaling_factor: 1.5
  moe_router_score_function: sqrtsoftplus
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 1e-3
  activation_func_clamp_value: 10.0
  mhc_sinkhorn_iterations: 20
  use_fused_mhc: true
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.1
  attention_dropout: 0.0
  hidden_dropout: 0.0
  mock_data: true
  seq_length: 4096
  moe_router_force_load_balancing: true
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 64
  context_parallel_size: 1
  expert_tensor_parallel_size: 1
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_grouped_gemm: true
  moe_permute_fusion: true
  moe_router_fusion: true
  moe_router_dtype: fp32
  recompute_granularity: selective
  recompute_modules:
  - mla_up_proj
  cuda_graph_impl: full_iteration
  te_rng_tracker: true
  use_mcore_models: true
  use_flash_attn: true
  transformer_impl: transformer_engine
  micro_batch_size: 1
  global_batch_size: 2048
  no_save_optim: true
  no_check_for_nan_in_loss_and_grad: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: native
  no_create_attention_mask_in_dataloader: true
  manual_gc: true
  manual_gc_interval: 10
  lr: 0.00027
  min_lr: 2.7e-05
  lr_warmup_init: 2.7e-05
  lr_decay_style: cosine
  weight_decay: 0.1
  clip_grad: 1.0
  bf16: true
  fp8_recipe: mxfp8
  fp8_format: e4m3
  fp8_param_gather: true
  reuse_grad_buf_for_mxfp8_param_ag: true
  main_grads_dtype: fp32
  main_params_dtype: fp32
  moe_router_padding_for_quantization: true
  init_method_std: 0.02
  eval_iters: 0
  eval_interval: 200
  log_throughput: true
  log_interval: 1
  logging_level: 20
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_validation_ppl_to_tensorboard: true
  tensorboard_dir: ${OUTPUT_PATH}/tensorboard
  wandb_exp_name: DeepSeek-V4-Flash-GB200-MXFP8-TP1PP1EP64-GBS2048SEQLEN4096
  enable_experimental: true
  output_projection_groups: 8
  output_projection_lora_rank: 1024
  moe_num_hash_layers: 3
  enable_mhc_connections: true
  mhc_num_residual_streams: 4
  moe_flex_dispatcher_num_sms: 32
  hybrid_layer_pattern: WEWECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECEHECE/WE
  spec:
  - megatron.core.models.hybrid.hybrid_layer_specs
  - hybrid_dsv4_stack_spec
  train_iters: 50
  lr_decay_iters: 50
  lr_warmup_iters: 0
  dsa_kernel_backend: cudnn
  dsa_indexer_precision: mxfp8
  moe_megakernel_backend: mok
  moe_megakernel_backend_config: '{"fwd_num_comm_sms":28,"bwd_num_comm_sms":28,"minibatch_size":4096,"macrobatch_size":32768,"schedule_capacity_multiplier":0.0625,"all_gather_top_experts_chunk_bytes":2048}'
  moe_hybridep_routing_map_mode: bool
  te_precision_config_file: examples/moe_recipes/deepseek_v4_flash/gb200/shared_expert_bf16.yaml
  num_workers: 0
  num_dataset_builder_threads: 1
  cuda_graph_warmup_steps: 3
  optimizer: muon
  muon_momentum: 0.95
  muon_coefficient_type: deepseekv4
  muon_num_ns_steps: 10
  no_use_layer_wise_param_layout: true
