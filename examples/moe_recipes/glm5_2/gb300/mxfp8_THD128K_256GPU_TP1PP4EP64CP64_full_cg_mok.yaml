  benchmark_megatron_commit: 6fd9341d529f51e5c259f6511e1c809cf86e0747
  hardware:
    gpu: GB300
    cpu_arch: aarch64
    num_gpus: 256
    num_nodes: 64
    gpus_per_node: 4
    nvl_domains: 4
    ep_ranks_per_domain: 64
  runtime_artifacts:
