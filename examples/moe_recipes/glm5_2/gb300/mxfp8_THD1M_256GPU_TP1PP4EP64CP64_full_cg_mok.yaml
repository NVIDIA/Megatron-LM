ENV_VARS:
  NCCL_NVLS_ENABLE: '0'
  NCCL_GRAPH_REGISTER: '0'
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  NVTE_CPU_OFFLOAD_V1: '0'
  NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
  NVTE_FUSED_ATTN: '1'
  NVTE_NORM_BWD_USE_CUDNN: '1'
  NVTE_NORM_FWD_USE_CUDNN: '1'
  CUDNN_PATH: /usr/lib/aarch64-linux-gnu
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,graph_capture_record_stream_reuse:True
  TORCH_NCCL_AVOID_RECORD_STREAMS: '0'
  MEGATRON_USE_UV: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: >-
    ${GLM52_DEPENDENCIES}/env:${GLM52_DEPENDENCIES}/mixture-of-kittens:${GLM52_DEPENDENCIES}/emerging_optimizers-0.5.0a0-py3-none-any.whl:${GLM52_DEEPSELECT}/site:${GLM52_DEEPGEMM}/site:${MEGATRON_ROOT}
  # Persistent DeepGEMM JIT cache shared by all ranks; run.py --prewarm-deepgemm fills it.
  DG_JIT_CACHE_DIR: '${DG_JIT_CACHE_DIR}'
  WANDB_MODE: disabled
ARGS:
  tokenizer_type: "NullTokenizer"
  vocab_size: 154880
  num_layers: 78
  hidden_size: 6144
  num_attention_heads: 64
  kv_channels: 256
  ffn_hidden_size: 12288
  max_position_embeddings: 1048576
  normalization: "RMSNorm"
  norm_epsilon: "1e-5"
  attention_latent_norm_epsilon: "1e-6"
  swiglu: true
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  position_embedding_type: "rope"
  rope_type: "rope"
  rotary_base: 8000000
  make_vocab_size_divisible_by: 128
  multi_latent_attention: true
  q_lora_rank: 2048
  kv_lora_rank: 512
  qk_head_dim: 192
  qk_pos_emb_head_dim: 64
  v_head_dim: 256
  qk_layernorm: true
  experimental_attention_variant: "dsa"
  dsa_indexer_n_heads: 32
  dsa_indexer_head_dim: 128
  dsa_indexer_topk: 2048
  dsa_indexer_topk_freq: 4
  dsa_indexer_skip_topk_offset: 3
  dsa_indexer_rope_interleaved: true
  dsa_indexer_k_norm_epsilon: "1e-6"
  no_dsa_indexer_rotate_activation: true
  no_dsa_indexer_weights_proj_use_quantization: true
  dsa_indexer_weights_proj_output_dtype: "bf16"
  dsa_indexer_loss_coeff: "1e-2"
  dsa_indexer_use_sparse_loss: true
  dsa_indexer_precision: "mxfp8"
  dsa_indexer_scorer_backend: "deepgemm"
  dsa_indexer_topk_backend: "deepselect"
  # Full-recompute replays reuse the top-k of the first forward instead of selecting again.
  dsa_indexer_reuse_checkpoint_topk: true
  num_experts: 256
  moe_layer_freq: "([0]*3+[1]*75)"
  moe_ffn_hidden_size: 2048
  moe_shared_expert_intermediate_size: 2048
  moe_router_load_balancing_type: "none"
  moe_router_topk: 8
  moe_router_pre_softmax: true
  moe_router_num_groups: 1
  moe_router_group_topk: 1
  moe_router_topk_scaling_factor: "2.5"
  moe_router_score_function: "sigmoid"
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: "1e-3"
  attention_dropout: "0.0"
  hidden_dropout: "0.0"
  seed: 1234
  mock_data: true
  seq_length: 1048576
  moe_router_force_load_balancing: true
  split: "100,0,0"
  use_varlen_dataset: true
  calculate_per_token_loss: true
  varlen_mock_dataset_config_json: "{\"mode\":\"distribution\",\"type\":\"lognormal\",\"min_seq_len\":1015809,\"max_seq_len\":1015809,\"mean_seq_len\":1015809,\"lognormal_sigma\":0.15}"
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 4
  expert_model_parallel_size: 64
  context_parallel_size: 64
  expert_tensor_parallel_size: 1
  # Interleaved schedule: two virtual stages per PP rank (22/24/20/12 decoder layers per rank).
  pipeline_model_parallel_layout: "Et*10|t*12|t*12|t*12|t*12|t*12|t*8|m*7L"
  # Full-iteration CUDA graphs are validated with batched (non-overlapped) PP send/recv.
  no_overlap_p2p_communication: true
  pipeline_model_parallel_prewarm: true
  recompute_granularity: "full"
  recompute_method: "uniform"
  recompute_num_layers: 1
  use_distributed_optimizer: true
  moe_token_dispatcher_type: "flex"
  moe_flex_dispatcher_backend: "hybridep"
  moe_flex_dispatcher_num_sms: 32
  moe_grouped_gemm: true
  moe_permute_fusion: true
  moe_router_fusion: true
  moe_router_dtype: "fp32"
  use_transformer_engine_op_fuser: true
  use_mcore_models: true
  transformer_impl: "transformer_engine"
  attention_backend: "auto"
  dsa_kernel_backend: "cudnn"
  cp_comm_type: "allgather"
  micro_batch_size: 1
  global_batch_size: 8
  max_seqlen_per_dp_cp_rank: 16384
  dynamic_context_parallel: true
  sequence_packing_scheduler: "default_dynamic_cp"
  min_dynamic_context_parallel_size: 1
  cp_partition_mode: "zigzag"
  pad_packed_seq_alignment: "max"
  thd_max_packed_sequences: 2
  thd_tail_padding_policy: "append_dummy_seq"
  cuda_graph_impl: "full_iteration"
  cuda_graph_static_dynamic_cp: true
  cuda_graph_warmup_steps: 3
  te_rng_tracker: true
  train_iters: 32
  eval_iters: 0
  eval_interval: 10000
  manual_gc: true
  manual_gc_interval: 10
  no_check_for_nan_in_loss_and_grad: true
  no_create_attention_mask_in_dataloader: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: "native"
  optimizer: "muon"
  muon_momentum: "0.95"
  muon_num_ns_steps: 5
  muon_scale_mode: "unit_rms_norm"
  muon_extra_scale_factor: "0.2"
  muon_split_qkv_per_head: true
  muon_split_mla_qkv: true
  lr: "1e-5"
  min_lr: "1e-5"
  lr_decay_style: "constant"
  lr_warmup_samples: 0
  weight_decay: "0.1"
  clip_grad: "1.0"
  adam_beta1: "0.9"
  adam_beta2: "0.95"
  bf16: true
  init_method_std: "0.02"
  no_save_optim: true
  no_load_optim: true
  no_load_rng: true
  log_interval: 1
  log_memory_interval: 32
  log_throughput: true
  enable_experimental: true
  fp8_recipe: "mxfp8"
  fp8_format: "e4m3"
  fp8_param_gather: true
  reuse_grad_buf_for_mxfp8_param_ag: true
  moe_router_padding_for_quantization: true
  log_device_memory_used: true
  mtp_num_layers: 7
  mtp_use_repeated_layer: true
  mtp_repeated_layer_shared_components: ["latent_kv", "sparse_attention_index"]
  mtp_loss_type: "e2e_tv"
  mtp_detach_heads: true
  mtp_loss_scaling_factor: "0.1"
  moe_hybridep_routing_map_mode: "bool"
  moe_megakernel_backend: "mok"
  moe_megakernel_backend_config: "{\"fwd_num_comm_sms\":40,\"bwd_num_comm_sms\":28,\"minibatch_size\":4096,\"macrobatch_size\":131072,\"schedule_capacity_multiplier\":0.5,\"all_gather_top_experts_chunk_bytes\":2048}"
VARIANTS:
  # run.py --variant frozen_indexer: with a zero indexer loss coefficient DSAIndexer freezes its
  # parameters; dsa_indexer_use_sparse_loss stays on.
  frozen_indexer:
    dsa_indexer_loss_coeff: "0"
