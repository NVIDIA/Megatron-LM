      commit: a44d1f83a4950b445f2a77ca71177c5f033d45d5
      wheel_path: emerging_optimizers-0.5.0a0-py3-none-any.whl
      wheel_sha256: dc143b4ab0cf3a0e6d945a695dadc710f8338f08a5abc6a107d80044c8b7ce1e
    deepselect:
      # GLM53_FLASH_DEEPSELECT: site/ds_tune (dsa_indexer_topk_backend: deepselect).
      repo: https://github.com/deepseek-ai/DeepSelect.git
      commit: bfa4507d935f17ebfc3d0f00ff7d3c9a4d0e5c18
