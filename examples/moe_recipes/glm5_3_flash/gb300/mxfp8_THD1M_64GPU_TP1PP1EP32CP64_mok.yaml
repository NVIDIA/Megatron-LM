    flash_linear_attention:
      # GLM53_FLASH_FLA: python/ holds the pure-Python fla-core 0.5.1 wheel's package (KDA kernels).
      package: fla-core 0.5.1
      source: https://pypi.org/project/fla-core/0.5.1/
      manifest_sha256: e4284e126fae00d828956159094b7eb721468fcff30ff723f5354ac4ba254a00
ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: '1'
  FLA_TILELANG: '0'
  NCCL_GRAPH_REGISTER: '0'
  NCCL_NVLS_ENABLE: '0'
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  NVTE_CPU_OFFLOAD_V1: '0'
  NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
  NVTE_FUSED_ATTN: '1'
  NVTE_NORM_BWD_USE_CUDNN: '1'
  NVTE_NORM_FWD_USE_CUDNN: '1'
  CUDNN_PATH: /usr/lib/aarch64-linux-gnu
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,graph_capture_record_stream_reuse:True
  TORCH_NCCL_AVOID_RECORD_STREAMS: '0'
  TORCH_NCCL_DUMP_ON_TIMEOUT: '1'
  TORCH_NCCL_TRACE_BUFFER_SIZE: '2000'
  TRITON_CACHE_AUTOTUNING: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: >-
    ${GLM53_FLASH_FLA}/python:${GLM53_FLASH_DEPENDENCIES}/env:${GLM53_FLASH_DEPENDENCIES}/mixture-of-kittens:${GLM53_FLASH_DEPENDENCIES}/emerging_optimizers-0.5.0a0-py3-none-any.whl:${GLM53_FLASH_DEEPSELECT}/site:${MEGATRON_ROOT}
  WANDB_MODE: disabled
ARGS:
  tokenizer_type: "NullTokenizer"
  vocab_size: 154880
  make_vocab_size_divisible_by: 128
  num_layers: 90
  hybrid_layer_pattern: "K-K-K-DEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKEKEKEDEKE/DE"
  spec: ["megatron.core.models.hybrid.hybrid_layer_specs", "hybrid_glm53_stack_spec"]
  hidden_size: 4096
  ffn_hidden_size: 12288
  num_attention_heads: 64
  kv_channels: 256
  max_position_embeddings: 1048576
  normalization: "RMSNorm"
  norm_epsilon: "1e-05"
  rmsnorm_cast_before_weight: true
  # Same rounding contract, run as Inductor kernels (only the reduction order may move the last bit).
  rmsnorm_cast_before_weight_compiled: true
  swiglu: true
  activation_func_clamp_value: "10.0"
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  position_embedding_type: "none"
  multi_latent_attention: true
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_head_dim: 256
  qk_pos_emb_head_dim: 0
  v_head_dim: 256
  qk_layernorm: true
  experimental_attention_variant: "dsa"
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 64
  linear_num_value_heads: 64
  kda_two_stage_gates: true
  kda_conv_in_fp32: true
  kda_safe_gate: true
  kda_lower_bound: "-5.0"
  kda_beta_sigmoid_in_projection_dtype: true
  transformer_impl: "transformer_engine"
  attention_backend: "fused"
  dsa_kernel_backend: "cudnn"
  dsa_indexer_n_heads: 32
  dsa_indexer_head_dim: 128
  dsa_indexer_topk: 2048
  dsa_indexer_topk_freq: 1
  dsa_indexer_kpool: 4
  dsa_indexer_kpool_key_dtype_compression: true
  dsa_indexer_hf_scoring: true
  no_dsa_indexer_rotate_activation: true
  dsa_indexer_k_norm_epsilon: "1e-06"
  no_dsa_indexer_weights_proj_use_quantization: true
  dsa_indexer_weights_proj_output_dtype: "bf16"
  # The KPool indexer trains by default with the sparse pool-level loss (its projections, gate
  # and pool position embedding); with cuDNN frontend 1.31 and the cuDNN KPool scorer the loss
  # runs on cuDNN frontend kernels. --variant frozen_indexer freezes it.
  dsa_indexer_loss_coeff: "1e-2"
  dsa_indexer_use_sparse_loss: true
  # KPool selection: cuDNN indexer kernel at ratio 4 over the pooled keys, DeepSelect top-k
  # where a call is wide enough (1M; narrower calls keep the cuDNN top-k).
  dsa_indexer_scorer_backend: "cudnn"
  dsa_indexer_topk_backend: "deepselect"
  enable_hyper_connections: true
  num_residual_streams: 4
  mhc_sinkhorn_iterations: 20
  mhc_init_gating_factor: "1.0"
  mhc_norm_eps_inside_sqrt: true
  mhc_normalize_before_projection: true
  mhc_keep_pre_in_fp32: true
  mhc_preserve_activation_dtype_rounding: true
  no_mhc_learned_output_contract: true
  # Fused mHC per op: the Triton GLM projection pair (fixed-config TF32 kernels, operands rounded
  # to nearest) and the fixed-launch Triton Sinkhorn. The triton policy raises instead of falling
  # back to the unfused path; the projection pair is validated on GB300 only.
  use_fused_mhc: true
  mhc_fused_ops: ["proj_rms", "sinkhorn"]
  mhc_fused_backend: "triton"
  mhc_fused_tf32_rounding: "rn"
  num_experts: 288
  moe_ffn_hidden_size: 2048
  moe_shared_expert_intermediate_size: 2048
  moe_router_load_balancing_type: "seq_aux_loss"
  moe_router_topk: 8
  moe_router_num_groups: 1
  moe_router_group_topk: 1
  moe_router_topk_scaling_factor: "2.5"
  moe_router_score_function: "sigmoid"
  moe_router_dtype: "fp32"
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: "0.001"
  moe_aux_loss_coeff: "0.001"
  moe_grouped_gemm: true
  mtp_num_layers: 1
  mtp_loss_scaling_factor: "0.1"
  no_mtp_enable_hyper_connections: true
  attention_dropout: "0.0"
  hidden_dropout: "0.0"
  mock_data: true
  seq_length: 1048576
  # Packed THD: mock documents of seq_length + 1 tokens (inputs plus the shifted label), one
  # per pack, so a step trains the same tokens as fixed-length sequences; the dp_balanced
  # scheduler packs them, and the loss is averaged per token.
  use_varlen_dataset: true
  varlen_mock_dataset_config_json: '{"mode":"distribution","type":"lognormal","min_seq_len":1048577,"max_seq_len":1048577,"mean_seq_len":1048577,"lognormal_sigma":0.15}'
  calculate_per_token_loss: true
  sequence_packing_scheduler: "dp_balanced"
  max_seqlen_per_dp_cp_rank: 16384
  pad_packed_seq_alignment: "max"
  # One global contiguous CP layout for the hybrid stack; the DSA layers convert to zigzag.
  cp_partition_mode: "contiguous"
  moe_router_force_load_balancing: true
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  expert_model_parallel_size: 32
  context_parallel_size: 64
  expert_tensor_parallel_size: 1
  use_distributed_optimizer: true
  sequence_parallel: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  moe_token_dispatcher_type: "flex"
  moe_flex_dispatcher_backend: "hybridep"
  moe_permute_fusion: true
  moe_router_fusion: true
  use_mcore_models: true
  use_flash_attn: true
  micro_batch_size: 1
  global_batch_size: 16
  train_samples: 192
  no_create_attention_mask_in_dataloader: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: "linear"
  manual_gc: true
  manual_gc_interval: 5
  seed: 1234
  # Muon for the matrix parameters (Adam for the rest), as in the GLM-5.2 recipes.
  optimizer: "muon"
  muon_momentum: "0.95"
  muon_num_ns_steps: 5
  muon_scale_mode: "unit_rms_norm"
  muon_extra_scale_factor: "0.2"
  muon_split_qkv_per_head: true
  muon_split_mla_qkv: true
  lr: "1e-5"
  min_lr: "1e-5"
  lr_decay_style: "constant"
  lr_warmup_samples: 0
  weight_decay: "0.1"
  clip_grad: "1.0"
  adam_beta1: "0.9"
  adam_beta2: "0.95"
  init_method_std: "0.02"
  eval_iters: 0
  eval_interval: 500
  ckpt_format: "torch_dist"
  dist_ckpt_strictness: "raise_all"
  log_throughput: true
  log_interval: 1
  log_num_zeros_in_grad: true
  log_params_norm: true
  enable_experimental: true
  distributed_timeout_minutes: 45
  bf16: true
  fp8_recipe: "mxfp8"
  fp8_format: "e4m3"
  fp8_param_gather: true
  reuse_grad_buf_for_mxfp8_param_ag: true
  moe_router_padding_for_quantization: true
  moe_flex_dispatcher_num_sms: 32
  # Routed experts on the MoE megakernel (MoK), as in the GLM-5.2 recipes: MXFP8 with FP8
  # parameters, boolean routing maps and no TE op fuser.
  moe_megakernel_backend: "mok"
  moe_megakernel_backend_config: '{"fwd_num_comm_sms":48,"bwd_num_comm_sms":36,"minibatch_size":4096,"macrobatch_size":131072,"schedule_capacity_multiplier":0.5,"all_gather_top_experts_chunk_bytes":2048}'
  moe_hybridep_routing_map_mode: "bool"
  use_transformer_engine_op_fuser: false
  logging_level: 20
  recompute_granularity: "selective"
  recompute_modules: ["mhc", "gdn", "moe", "mla_up_proj"]
  # Recompute the MoE megakernel only up to layer 50: the last 20 MoE layers keep their
  # activations, which is what the memory left at 1M allows.
  moe_recompute_max_layer_number: 50
  cp_comm_type: "all_gather"
  mhc_recompute_layer_num: 8
  log_memory_interval: 1
  chunked_optimizer_state_offload: true
  optimizer_state_offload_fraction: "1.0"
  optimizer_state_offload_chunk_size_mb: 2048
  log_device_memory_used: true
VARIANTS:
  # run.py --variant frozen_indexer: with a zero indexer loss coefficient DSAIndexer freezes its
  # parameters (the released checkpoint's indexer); dsa_indexer_use_sparse_loss stays on.
  frozen_indexer:
    dsa_indexer_loss_coeff: "0"
