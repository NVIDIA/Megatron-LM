      commit: a2ad2d0ce2366c1817d15498cdbaf8ead5966117
      thunderkittens_commit: 1c3920d993404dd49a6d4c7267ea11d583bd5c68
      thunderkittens_patch_sha256: e001b2d0b6e4088bcedb5cef49bf6811d1757b9e9e9835ae50744ee54b8f633d
      extension_path: mixture-of-kittens/mok/_C.cpython-312-aarch64-linux-gnu.so
      extension_sha256: 722573258dad5e54df92621f1fac36e618a3eb98b4cc7569694842d863ff3607
    emerging_optimizers:
