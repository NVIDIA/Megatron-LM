# Redirects from the legacy Sphinx site to this Fern site.
# The first matching rule wins, so specific rules come first.
# "source" is matched without the site base path; "destination" must include it.
# Pattern sources must not start with the text of the base path (/megatron), and
# /megatron-core does, so the first segment is captured as `:dir(megatron\-core)`.
# Hyphens inside a parameter regex are escaped, and each pattern source starts with
# a parameter. Keep every rule a single hop to a real page.
#
# - legacy /latest/  -> the default Fern version (unprefixed /megatron/<page>).
#   If the default version changes, review that its slugs still match.
# - legacy /nightly/ -> the Fern "nightly" version (/megatron/nightly/<page>),
#   which stays valid whether or not nightly is the default version.
#
# Older numbered versions (0.15.0 - 0.20.0) are served from archive.docs.nvidia.com
# and are intentionally not redirected. `fern docs dev` cannot test redirects,
# so verify them on a preview deployment.
redirects:

  # ===== legacy /latest/ =====
  # Site root
  - source: '/:dir(megatron\-core)/developer-guide/latest/index.html'
    destination: /megatron
