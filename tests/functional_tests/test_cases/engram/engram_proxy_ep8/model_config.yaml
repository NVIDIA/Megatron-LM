ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
  CUBLAS_WORKSPACE_CONFIG: :4096:8
  NCCL_ALGO: Ring
MODEL_ARGS:
  --num-layers: 8
  --hidden-size: 1024
  --ffn-hidden-size: 4096
  --num-attention-heads: 16
  --max-position-embeddings: 4096
  --seq-length: 4096
  --micro-batch-size: 1
  --global-batch-size: 8
  --train-iters: 10
  --lr-decay-iters: 10
  --lr-warmup-iters: 0
  --lr: 0.00015
  --min-lr: 0.00001
  --lr-decay-style: cosine
  --optimizer: adam
  --adam-beta1: 0.9
  --adam-beta2: 0.95
  --weight-decay: 0.1
  --clip-grad: 1.0
  --bf16: true
  --use-mcore-models: true
  --transformer-impl: transformer_engine
  --attention-backend: auto
  --disable-bias-linear: true
  --normalization: RMSNorm
  --norm-epsilon: 0.000001
  --swiglu: true
  --position-embedding-type: rope
  --rotary-base: 10000
  --attention-dropout: 0.0
  --hidden-dropout: 0.0
  --tensor-model-parallel-size: 1
  --pipeline-model-parallel-size: 1
  --expert-model-parallel-size: 8
  --expert-tensor-parallel-size: 1
  --context-parallel-size: 1
  --num-experts: 8
  --moe-layer-freq: 1
  --moe-ffn-hidden-size: 4096
  --moe-router-topk: 2
  --moe-router-load-balancing-type: aux_loss
  --moe-aux-loss-coeff: 0.0
  --moe-router-dtype: fp32
  --moe-token-dispatcher-type: alltoall
  --moe-grouped-gemm: true
  --moe-permute-fusion: true
  --tokenizer-type: HuggingFaceTokenizer
  --tokenizer-model: deepseek-ai/DeepSeek-V3
  --make-vocab-size-divisible-by: 3232
  --mock-data: true
  --split: 949,50,1
  --engram-vocab-sizes: "[646400 646400]"
  --engram-layer-ids: "[1 5]"
  --engram-max-ngram-order: 3
  --engram-num-hash-heads: 8
  --engram-memory-dim: 512
  --engram-kernel-size: 4
  --engram-hash-seed: 0
  --engram-pad-token-id: 2
  --engram-tokenizer-map: tests/functional_tests/test_cases/engram/deepseek_v3_tokenizer_map.json
  --engram-embedding-lr-multiplier: 5.0
  --engram-embedding-weight-decay: 0.0
  --use-distributed-optimizer: true
  --deterministic-mode: true
  --no-gradient-accumulation-fusion: true
  --no-bias-gelu-fusion: true
  --seed: 1234
  --distributed-backend: nccl
  --distributed-timeout-minutes: 60
  --ckpt-format: torch_dist
  --save: ${CHECKPOINT_SAVE_PATH}
  --load: ${CHECKPOINT_LOAD_PATH}
  --save-interval: 5
  --log-interval: 1
  --eval-interval: 1000
  --eval-iters: 0
  --log-memory-to-tensorboard: true
  --log-num-zeros-in-grad: true
  --log-params-norm: true
  --tensorboard-dir: ${TENSORBOARD_PATH}
  --exit-interval: 10
TEST_TYPE: ckpt-resume
METRICS:
  - lm loss
  - mem-allocated-bytes
  - mem-max-allocated-bytes
