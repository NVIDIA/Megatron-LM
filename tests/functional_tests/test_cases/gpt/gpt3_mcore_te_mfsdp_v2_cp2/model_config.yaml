# Dense GPT on Megatron-FSDP v2 with context parallelism, TP=1/PP=1/CP=2 over 8 GPUs
# (so DP=4). MFSDP v2 shards over the dp_cp group, which folds the CP ranks into the
# same axis it already reduces gradients over, so CP must not change the math -- this
# case pins that down end to end.
ENV_VARS:
  # run_ci_test.sh always exports this (yq prints "null" for a missing key,
  # which fails determinism.py's validator), so it must be set explicitly.
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
MODEL_ARGS:
  # Precision
  --bf16: true
  # Distributed args
  --tensor-model-parallel-size: 1
  --pipeline-model-parallel-size: 1
  --context-parallel-size: 2
  --distributed-backend: nccl
  --distributed-timeout-minutes: 60
  # FSDP args
  --use-megatron-fsdp: true
  --megatron-fsdp-version: 2
  --data-parallel-sharding-strategy: "optim_grads_params"
  --ckpt-format: "fsdp_dtensor"
  --no-gradient-accumulation-fusion: true
  # Training args
  --use-mcore-models: true
  --transformer-impl: transformer_engine
  # CP needs an attention backend that implements the ring exchange; the unfused
  # backend does not.
  --attention-backend: flash
  --micro-batch-size: 4
  --global-batch-size: 32
  --train-iters: 50
  --seq-length: 1024
  --max-position-embeddings: 1024
  --timing-log-level: 0
  --lr-decay-iters: 320000
  # Data args
  --data-path: ${DATA_PATH}/text/common_pile/v01_filtered_data/my-gpt3_00_text_document
  --data-cache-path: ${DATA_CACHE_PATH}
  --tokenizer-type: NullTokenizer
  --vocab-size: 50257
  --split: 949,50,1
  # Network
  --num-layers: 12
  --hidden-size: 512
  --num-attention-heads: 8
  # Regularization
  --attention-dropout: 0.0
  --hidden-dropout: 0.0
  --attention-softmax-in-fp32: true
  --clip-grad: 1.0
  --weight-decay: 1e-2
  # Learning rate args
  --lr: 0.00015
  --min-lr: 1.0e-5
  --lr-decay-style: cosine
  --lr-warmup-fraction: .01
  # Validation, checkpointing, logging
  --eval-interval: 1000
  --eval-iters: 10
  --save-interval: 10000
  --log-interval: 1
  --log-params-norm: true
  --log-num-zeros-in-grad: true
  --log-memory-to-tensorboard: true
  --log-timers-to-tensorboard: true
  --log-validation-ppl-to-tensorboard: true
  --tensorboard-dir: ${TENSORBOARD_PATH}
  --exit-interval: 50
TEST_TYPE: regular
METRICS:
  - "lm loss"
  - "mem-allocated-bytes"
  - "mem-max-allocated-bytes"
LAUNCHER: ft_launcher
