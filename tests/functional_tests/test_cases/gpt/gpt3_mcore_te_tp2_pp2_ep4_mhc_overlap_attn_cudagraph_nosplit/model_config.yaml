ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
  NCCL_ALGO: Ring
  CUBLAS_WORKSPACE_CONFIG: :4096:8
MODEL_ARGS:
  # Sibling of gpt3_mcore_te_tp2_pp2_mhc_attn_cudagraph, which is dense and so
  # never builds the mhc_post schedule node. This case adds MoE and EP a2a
  # overlap, which is what puts mHC post-processing on its own compute-stream
  # node -- the change this PR is built around, and the one whose failure mode
  # (a cross-stream use-after-free surfacing as ~1e8 grad norms) is visible in a
  # multi-rank loss curve rather than in a single-process unit test.
  # TP=2, PP=2, DP=2, EP=4, ETP=1 -> eight GPUs, interleaved (VPP=2).
  #
  # VPP is deliberate, not incidental: interleaving is where the use-after-free
  # actually bit (grad norms ~1e8 from the first iteration). This variant runs
  # the same shape WITHOUT the attention-only split (switch off): whole-attention
  # capture plus the repaired non-split overlap replay tail -- manager threading,
  # pre-MLP checkpoint, and padding_mask routing. It is the CI-executed coverage
  # for the switch-off default, which the unit-level parity tests cannot provide
  # (they carry the flaky markers this test family deselects in CI).
  --num-layers: 12
  --num-layers-per-virtual-pipeline-stage: 3
  --hidden-size: 512
  --num-attention-heads: 8
  --micro-batch-size: 4
  --global-batch-size: 32
  --seq-length: 1024
  --max-position-embeddings: 1024
  --train-iters: 50
  --exit-interval: 50
  --timing-log-level: 0
  --lr-decay-iters: 320000
  --save: ${CHECKPOINT_SAVE_PATH}
  --load: ${CHECKPOINT_LOAD_PATH}
  --save-interval: 1000
  --tokenizer-type: NullTokenizer
  --vocab-size: 50257
  --mock-data: true
  --split: 949,50,1
  --distributed-backend: nccl
  --lr: 0.00015
  --lr-decay-style: cosine
  --min-lr: 1.0e-5
  --weight-decay: 1e-2
  --clip-grad: 1.0
  --lr-warmup-fraction: .01
  --log-interval: 1
  --log-num-zeros-in-grad: true
  --log-params-norm: true
  --tensorboard-dir: ${TENSORBOARD_PATH}
  --eval-interval: 1000
  --eval-iters: 1
  --transformer-impl: transformer_engine
  --tensor-model-parallel-size: 2
  --pipeline-model-parallel-size: 2
  --expert-model-parallel-size: 4
  --expert-tensor-parallel-size: 1
  --deterministic-mode: true
  --no-gradient-accumulation-fusion: true
  --attention-softmax-in-fp32: true
  --use-mcore-models: true
  --ckpt-format: torch_dist
  --dist-ckpt-optim-fully-reshardable: true
  --dist-ckpt-strictness: log_all
  --data-cache-path: ${DATA_CACHE_PATH}
  --bf16: true
  --attention-backend: unfused
  --sequence-parallel: true
  --log-memory-to-tensorboard: true
  --log-timers-to-tensorboard: true

  # MoE. Every layer is an expert layer so every layer builds an mhc_post node;
  # the dense hyper-connection path is already covered by the sibling case.
  # TEGroupedMLP asserts bias_dropout_fusion and add_bias_linear are not both
  # on, and both default to True; every MoE case in the suite disables the bias.
  --disable-bias-linear: true
  --num-experts: 8
  --moe-ffn-hidden-size: 512
  --moe-router-topk: 2
  --moe-router-load-balancing-type: aux_loss
  --moe-aux-loss-coeff: 1e-2
  --moe-token-dispatcher-type: alltoall
  --moe-grouped-gemm: true
  --moe-router-dtype: fp32

  # The overlap schedule: this is what moves mHC post-processing onto its own
  # compute-stream node.
  --overlap-moe-expert-parallel-comm: true

  --enable-hyper-connections: true
  --num-residual-streams: 4
  --mhc-sinkhorn-iterations: 20
  --mhc-init-gating-factor: 0.01
  --recompute-granularity: selective
  --recompute-modules: "[mhc]"
  --mhc-recompute-layer-num: 2

  # Only the one-stream attention consumer is captured. mHC mapping,
  # aggregation, post-processing, MLP, and recompute stay eager.
  --cuda-graph-impl: transformer_engine
  --cuda-graph-modules: "[attn]"
  --cuda-graph-warmup-steps: 3
  --te-rng-tracker: true
TEST_TYPE: regular
METRICS:
  - "lm loss"
  - "num-zeros"
