# Inference functional test: correctness while the KV cache is saturated.
#
# Every other dynamic-inference test runs with a 20 GB (or default 40 GB) KV
# buffer and leaves the paused buffer unset, so the pool never fills, requests
# never pause, and the evict/requeue path never runs end-to-end. High-concurrency
# RL workloads live in the opposite regime. This test reproduces it by shrinking
# the buffer to a few dozen blocks, giving paused requests a small but non-zero
# retention budget, and releasing every request at once, then holding generated
# tokens and logprobs to the same golden comparison as the unsaturated tests.
ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
  NCCL_ALGO: Ring
  CUBLAS_WORKSPACE_CONFIG: :4096:8
TEST_TYPE: frozen-start
MODE: inference
MODEL_ARGS:
  --tiktoken-pattern: v2
  --use-mcore-models: true
  --tokenizer-type: TikTokenizer
  --tokenizer-model: ${CHECKPOINT_LOAD_PATH}/model/mcore_mistral/nemo_minitron-0.5b/v1/multiMixV8.gpt4o_nc_sd.500000.128k.vocab.json
  --auto-detect-ckpt-format: true
  --max-tokens-to-oom: 3600000
  --inference-max-seq-length: 4096
  --attention-backend: flash
  --use-checkpoint-args: true
  --micro-batch-size: 1
  --no-load-optim: true
  --no-use-tokenizer-model-from-checkpoint-args: true
  --timing-log-level: 0
  --load: ${CHECKPOINT_LOAD_PATH}/model/mcore_mistral/nemo_minitron-0.5b/v1
  --distributed-backend: nccl
  --log-interval: 1
  --transformer-impl: transformer_engine
  --tensor-model-parallel-size: 1
  --pipeline-model-parallel-size: 1
  --deterministic-mode: true
  --ckpt-format: torch_dist
  --bf16: true
  --log-memory-to-tensorboard: true
  --log-num-zeros-in-grad: true
  --log-validation-ppl-to-tensorboard: true
  --log-timers-to-tensorboard: true
  --num-layers: 24
  --hidden-size: 1152
  --num-attention-heads: 16
  --max-position-embeddings: 1024
  --seq-length: 1024
  --temperature: 1.0
  --top_k: 1
  --return-log-probs: true
  --dist-ckpt-strictness: log_unexpected
  --inference-ckpt-non-strict: true # To handle the extra_state errors
  --output-path: ${INFERENCE_OUTPUT_PATH}
  # Real prompts of realistic, uneven length so requests span several blocks and
  # cross block boundaries mid-generation, which is what triggers a pause.
  --prompt-file: ${DATA_PATH}/text/sharegpt-vicuna/filtered/processed.jsonl
  --prompt-file-num-truncate: 64
  --num-tokens-to-generate: 64
  --termination-id: -1 # fixed output lengths keep the goldens stable
  # Small enough that the prompts alone oversubscribe the pool, but still wider
  # than a single max-length request needs, so nothing fails at admission.
  --inference-dynamic-batching-buffer-size-gb: 0.75
  # Above what the pool can ever hold, so the KV cache -- not the request cap --
  # is what bounds concurrency. Left at its derived default the two limits are
  # the same order and the test would not clearly be about the cache.
  --inference-dynamic-batching-max-requests: 64
  # Non-zero retention budget: paused requests keep a few blocks instead of being
  # evicted on the spot, which is the partial-retention path a zero budget skips.
  --inference-dynamic-batching-paused-buffer-size-gb: 0.15
  --incoming-requests-per-sec: -1 # all requests arrive up front
  --inference-repeat-n: 1
  --inference-logging-step-interval: 1
METRICS:
  - "generated_tokens"
  - "logprobs"
LAUNCHER: ft_launcher
