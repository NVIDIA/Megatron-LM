# Four-GPU runtime-CP integration: Mamba, GDN, attention, mixed layouts, and MTP.
ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 1
  NCCL_ALGO: Ring
  CUBLAS_WORKSPACE_CONFIG: :4096:8
MODEL_ARGS:
  --num-layers: 6
  --hidden-size: 256
  --ffn-hidden-size: 512
  --num-attention-heads: 8
  --hybrid-layer-pattern: "M-G-*-/-"
  --spec: "[megatron.core.models.hybrid.hybrid_layer_specs hybrid_stack_spec]"
  --mamba-state-dim: 16
  --mamba-head-dim: 32
  --mamba-num-groups: 8
  --linear-key-head-dim: 32
  --linear-value-head-dim: 32
  --linear-num-key-heads: 8
  --linear-num-value-heads: 8
  --gdn-kernel-backend: fla
  --linear-cp-mode: headwise
  --linear-cp-layout: contiguous
  --attention-cp-layout: zigzag
  --mtp-num-layers: 1
  --mtp-loss-scaling-factor: 0.1
  --tensor-model-parallel-size: 2
  --pipeline-model-parallel-size: 1
  --context-parallel-size: 1
  --sequence-parallel: true
  --dynamic-context-parallel: true
  --min-dynamic-context-parallel-size: 1
  --calculate-per-token-loss: true
  --sequence-packing-scheduler: default_dynamic_cp
  --max-seqlen-per-dp-cp-rank: 1024
  --pad-packed-seq-alignment: 32
  --micro-batch-size: 1
  --global-batch-size: 16
  --seq-length: 2048
  --max-position-embeddings: 2048
  --train-iters: 20
  --mock-data: true
  --use-varlen-dataset: true
  --varlen-mock-dataset-config-json: tests/functional_tests/test_cases/hybrid/hybrid_dynamic_cp_tp2_sp/mock_config.json
  --tokenizer-type: NullTokenizer
  --vocab-size: 4096
  --data-cache-path: ${DATA_CACHE_PATH}
  --split: 949,50,1
  --dataloader-type: single
  --num-workers: 0
  --no-create-attention-mask-in-dataloader: true
  --distributed-backend: nccl
  --lr: 0.00015
  --lr-decay-style: constant
  --min-lr: 0.00015
  --weight-decay: 0.01
  --clip-grad: 1.0
  --hidden-dropout: 0.0
  --attention-dropout: 0.0
  --normalization: RMSNorm
  --swiglu: true
  --position-embedding-type: rope
  --transformer-impl: transformer_engine
  --attention-backend: auto
  --bf16: true
  --use-distributed-optimizer: true
  --no-gradient-accumulation-fusion: true
  --untie-embeddings-and-output-weights: true
  --log-interval: 1
  --tensorboard-dir: ${TENSORBOARD_PATH}
  --save: ${CHECKPOINT_SAVE_PATH}
  --load: ${CHECKPOINT_LOAD_PATH}
  --save-interval: 10000
  --eval-interval: 1000
  --eval-iters: 0
  --ckpt-format: torch_dist
TEST_TYPE: regular
METRICS:
  - lm loss
  - mtp_1 loss
