ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
  NCCL_ALGO: Ring
  CUBLAS_WORKSPACE_CONFIG: :4096:8
  TRITON_CACHE_AUTOTUNING: 0
  MAMBA_DETERMINISTIC: 1
TEST_TYPE: frozen-start
MODE: inference
MODEL_ARGS:
  --log-num-zeros-in-grad: true
  --log-validation-ppl-to-tensorboard: true
  --log-timers-to-tensorboard: true
  --log-memory-to-tensorboard: true
  --timing-log-level: 0
  --load: ${CHECKPOINT_LOAD_PATH}/model/mamba_hybrid_2b/dcp/mcore-v1_bf16/checkpoint
  --tokenizer-model: ${CHECKPOINT_LOAD_PATH}/model/mamba_hybrid_2b/dcp/mcore-v1_bf16/multiMixV8.gpt4o_nc_sd.500000.128k.vocab.json
  --tokenizer-type: TikTokenizer
  --tiktoken-pattern: v2
  --distributed-backend: nccl
  --log-interval: 1
  --transformer-impl: transformer_engine
  --tensor-model-parallel-size: 1
  --pipeline-model-parallel-size: 1
  --expert-model-parallel-size: 1
  --use-mcore-models: true
  --model-provider: hybrid
  --init-method-std: 0.014
  --untie-embeddings-and-output-weights: true
  --disable-bias-linear: true
  --position-embedding-type: none
  --hidden-size: 2048
  --ffn-hidden-size: 11264
  --num-attention-heads: 16
  --kv-channels: 128
  --hybrid-layer-pattern: M-M-M-M*-M-M-M-M*-M-M-M-M-M*-M-M-M-M-M*-M-M-M-M-M-
  --spec: megatron.core.models.hybrid.hybrid_layer_specs hybrid_stack_spec
  --normalization: RMSNorm
  --swiglu: true
  --attention-dropout: 0.0
  --hidden-dropout: 0.0
  --seq-length: 4096
  --max-position-embeddings: 4096
  --micro-batch-size: 1
  --ckpt-format: torch_dist
  --ckpt-fully-parallel-load: true
  --ckpt-assume-constant-structure: true
  --dist-ckpt-strictness: log_unexpected
  --bf16: true
  --attention-backend: flash
  --no-create-attention-mask-in-dataloader: true
  --num-workers: 8
  --use-checkpoint-args: true
  --no-use-tokenizer-model-from-checkpoint-args: true
  --no-load-optim: true
  --deterministic-mode: true
  --temperature: 1.0
  --top_k: 1
  --top_p: 0
  --return-log-probs: true
  --skip-prompt-log-probs: true
  --num-tokens-to-generate: 30
  --max-tokens-to-oom: 3600000
  --inference-max-seq-length: 4096
  --inference-dynamic-batching-buffer-size-gb: 0.25
  --inference-dynamic-batching-max-requests: 4
  --inference-dynamic-batching-max-tokens: 2048
  --inference-dynamic-batching-prefix-caching: true
  --inference-dynamic-batching-prefix-caching-eviction-policy: ref_zero
  --inference-dynamic-batching-prefix-caching-mamba-gb: 2
  --num-speculative-tokens: 0
  --prefix-cache-compare: true
  --prefix-cache-stress-groups: 20
  --prefix-cache-stress-copies: 5
  --prefix-cache-stress-prompt-tokens: 512
  --prefix-cache-stress-staged: true
  --output-path: ${INFERENCE_OUTPUT_PATH}
  --prompts: "Time travel to 2008, and go to a bar or a club or one of the myriad disco-basements on the Lower East Side that does not quite know which of those it is. Dance awkwardly in a room full of other glittered-up nerds, and wait for something to happen, buoyed on the feeling that this is the big swollen heart of life, that this is New York like the movies."
  --incoming-requests-per-step: 1
  --inference-repeat-n: 3
  --no-record-throughput: true
  --mamba-inference-conv-states-dtype: fp32
  --mamba-inference-ssm-states-dtype: fp32
METRICS:
  - "generated_tokens"
  - "generated_text"
  - "logprobs"
LAUNCHER: ft_launcher
