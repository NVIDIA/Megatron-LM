ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
  NCCL_ALGO: Ring
  CUBLAS_WORKSPACE_CONFIG: :4096:8
MODEL_ARGS:
  --num-layers: 4
  --hidden-size: 256
  --ffn-hidden-size: 512
  --num-attention-heads: 4
  --linear-key-head-dim: 32
  --linear-value-head-dim: 32
  --linear-num-key-heads: 4
  --linear-num-value-heads: 4
  --hybrid-layer-pattern: G-*-/*-
  --spec: '[megatron.core.models.hybrid.hybrid_layer_specs hybrid_stack_spec]'
  --enable-mhc-connections: true
  --mhc-num-residual-streams: 2
  --mtp-num-layers: 1
  --mtp-loss-scaling-factor: 0.1
  --tensor-model-parallel-size: 2
  --pipeline-model-parallel-size: 1
  --sequence-parallel: true
  --micro-batch-size: 1
  --global-batch-size: 16
  --seq-length: 128
  --max-position-embeddings: 128
  --train-iters: 20
  --mock-data: true
  --tokenizer-type: NullTokenizer
  --vocab-size: 256
  --data-cache-path: ${DATA_CACHE_PATH}
  --split: 949,50,1
  --distributed-backend: nccl
  --lr: 0.00015
  --lr-decay-style: cosine
  --min-lr: 1.0e-05
  --lr-warmup-iters: 2
  --weight-decay: 1e-2
  --clip-grad: 1.0
  --hidden-dropout: 0.0
  --attention-dropout: 0.0
  --normalization: RMSNorm
  --swiglu: true
  --position-embedding-type: rope
  --transformer-impl: transformer_engine
  --bf16: true
  --deterministic-mode: true
  --use-distributed-optimizer: true
  --no-gradient-accumulation-fusion: true
  --untie-embeddings-and-output-weights: true
  --log-params-norm: true
  --log-num-zeros-in-grad: true
  --log-interval: 1
  --log-memory-to-tensorboard: true
  --tensorboard-dir: ${TENSORBOARD_PATH}
  --save: ${CHECKPOINT_SAVE_PATH}
  --load: ${CHECKPOINT_LOAD_PATH}
  --save-interval: 10000
  --eval-interval: 1000
  --eval-iters: 2
  --ckpt-format: torch_dist
  --cuda-graph-warmup-steps: 3
  --use-fused-mhc: true
  --te-rng-tracker: true
  --cuda-graph-impl: full_iteration
  --no-check-for-nan-in-loss-and-grad: true
TEST_TYPE: regular
METRICS:
- lm loss
- mtp_1 loss
LAUNCHER: ft_launcher
