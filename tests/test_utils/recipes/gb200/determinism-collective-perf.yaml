type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}"
  model: gpt
  nodes: 1
  build: mcore-pyt-{environment}
  gpus: 4
  platforms: dgx_gb200
  script_setup: |
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    export CUDA_DEVICE_MAX_CONNECTIONS=32
    cd /opt/megatron-lm
    uv run --no-sync python tests/performance_tests/shell_test_utils/determinism/collective_pipeline.py \
      --output "{assets_dir}/logs/collective-performance" --gpus {gpus}

products:
  # Capture/replay/reference/timing pilot. Requires the collective and startup dependencies.
  # Report only until hardware-specific budgets and baseline promotion are reviewed.
  - test_case: [determinism_collective_perf]
    products:
      - environment: [dev]
        scope: [L1]
        cadence: [nightly]
        platforms: [dgx_gb200]
        n_repeat: [1]
        time_limit: [3600]
