type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}"
  model: gpt
  nodes: 1
  build: mcore-pyt-{environment}
  gpus: 4
  platforms: dgx_gb200
  script_setup: |
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    cd /opt/megatron-lm
    export DETERMINISM_PERF_RECIPE={perf_recipe}
    export DETERMINISM_PERF_GPUS={gpus}
    bash tests/performance_tests/shell_test_utils/determinism/perf_breakdown.sh \
      "{assets_dir}/logs/perf-leaderboards" \
      "{assets_dir}/logs"

products:
  # Nightly integration matrix rows; the current workflow selects L1 with
  # cadence=nightly. Keep GB200 results separate from the H100 baseline.
  - test_case: [determinism_perf]
    products:
      - environment: [dev]
        perf_recipe: [dense]
        scope: [L1]
        cadence: [nightly]
        platforms: [dgx_gb200]
        n_repeat: [1]
        time_limit: [3600]
  - test_case: [determinism_perf_moe]
    products:
      - environment: [dev]
        perf_recipe: [moe]
        scope: [L1]
        cadence: [nightly]
        platforms: [dgx_gb200]
        n_repeat: [1]
        time_limit: [3600]
  - test_case: [determinism_perf_hybrid]
    products:
      - environment: [dev]
        perf_recipe: [hybrid]
        scope: [L1]
        cadence: [nightly]
        platforms: [dgx_gb200]
        n_repeat: [1]
        time_limit: [3600]
