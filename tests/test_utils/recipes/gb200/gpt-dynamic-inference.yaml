type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: '{test_case}_{environment}_{platforms}'
  model: gpt
  build: mcore-pyt-{environment}
  nodes: 1
  gpus: 4
  n_repeat: 1
  platforms: dgx_gb200
  script_setup: |
    set -euo pipefail
    unset https_proxy
    readonly source_repo=https://gitlab-master.nvidia.com/adlr/megatron-lm.git
    readonly source_commit=8cce2e2644161aa94e813b8aa6d953a7e900fe51
    authenticated_git() {
      git -c credential.helper='!f() {
        printf "%s\n" username=okoenig "password=$RO_API_TOKEN"
      }; f' "$@"
    }

    # Fetch only the fixed repository and reviewed parent; candidate-controlled
    # repository and revision variables never receive the credential.
    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin "$source_repo"
    authenticated_git fetch --no-tags origin "$source_commit"
    test "$(git rev-parse FETCH_HEAD)" = "$source_commit"
    git checkout --detach "$source_commit"
    test "$(git rev-parse HEAD)" = "$source_commit"

    # This recipe does not use a legacy checkout.
    unset -f authenticated_git
    unset RO_API_TOKEN MCORE_REPO MCORE_MR_COMMIT MCORE_BACKWARDS_COMMIT
  script: |-
    set -euo pipefail
    ls
    cd /opt/megatron-lm
    export GPUS_PER_NODE={gpus}

    ARGUMENTS=(
        "CHECKPOINT_LOAD_PATH=/mnt/artifacts"
        "CHECKPOINT_SAVE_PATH=/tmp/checkpoints"
        "DATA_PATH=/mnt/artifacts"
        "DATA_CACHE_PATH=/workspace/data/cache"
        "TRAINING_SCRIPT_PATH=examples/inference/advanced/gpt_dynamic_inference.py"
        "TRAINING_PARAMS_PATH=./tests/functional_tests/test_cases/{model}/{test_case}/model_config.yaml"
        "GOLDEN_VALUES_PATH=./tests/functional_tests/test_cases/{model}/{test_case}/golden_values_{environment}_{platforms}.json"
        "OUTPUT_PATH={assets_dir}"
        "TENSORBOARD_PATH={assets_dir}/tensorboard"
        "INFERENCE_OUTPUT_PATH={assets_dir}/golden_values_{environment}_{platforms}.json"
        "N_REPEAT={n_repeat}"
        "ENABLE_LIGHTWEIGHT_MODE=${{ENABLE_LIGHTWEIGHT_MODE:-}}"
        "RECORD_CHECKPOINTS=${{RECORD_CHECKPOINTS:-}}"
    )

    bash ./tests/functional_tests/shell_test_utils/run_ci_test.sh ${{ARGUMENTS[@]}}

products:
  - test_case: [gpt_dynamic_inference_tp1_pp1_583m_async_sched]
    products:
      - environment: [dev]
        scope: [mr]
        platforms: [dgx_gb200]
