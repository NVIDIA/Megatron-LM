type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}"
  model: nemotron
  build: mcore-pyt-{environment}
  nodes: 2
  gpus: 4
  segment: 2
  n_repeat: 5
  platforms: dgx_gb200
  training_script: pretrain_hybrid.py
  compare_to_golden: "true"
  script_setup: |
    set -euo pipefail
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    # Checkout latest
    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD

    # Checkout backwards-ref
    cd /opt
    rm -rf /opt/megatron-lm-legacy; mkdir megatron-lm-legacy; cd megatron-lm-legacy
    git init
    git remote add origin $MCORE_REPO
    git fetch origin $MCORE_BACKWARDS_COMMIT
    git checkout $MCORE_BACKWARDS_COMMIT
    git rev-parse HEAD
    rm -rf megatron; cp -a /opt/megatron-lm/megatron ./
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    : "${{RUN_ID:=pr-$$}}"
    cd /opt/megatron-lm

    export GPUS_PER_NODE={gpus}

    GOLDEN_VALUES_PATH=./tests/functional_tests/test_cases/{model}/{test_case}/golden_values_{environment}_{platforms}.json
    if [[ "{compare_to_golden}" == "false" ]]; then
        GOLDEN_VALUES_PATH=""
    fi

    ARGUMENTS=(
        "DATA_PATH=/mnt/artifacts"
        "DATA_CACHE_PATH=/lustre/fsw/coreai_dlalgo_mcore/mcore_ci/data/$RUN_ID/cache/"
        "OUTPUT_PATH={assets_dir}"
        "TENSORBOARD_PATH={assets_dir}/tensorboard"
        "CHECKPOINT_SAVE_PATH={artifacts_dir}/checkpoints"
        "CHECKPOINT_LOAD_PATH=/mnt/artifacts"
        "TRAINING_SCRIPT_PATH={training_script}"
        "TRAINING_PARAMS_PATH=./tests/functional_tests/test_cases/{model}/{test_case}/model_config.yaml"
        "GOLDEN_VALUES_PATH=$GOLDEN_VALUES_PATH"
        "N_REPEAT={n_repeat}"
        "ENABLE_LIGHTWEIGHT_MODE=${{ENABLE_LIGHTWEIGHT_MODE:-}}"
        "RECORD_CHECKPOINTS=${{RECORD_CHECKPOINTS:-}}"
    )

    bash ./tests/functional_tests/shell_test_utils/run_ci_test.sh "${{ARGUMENTS[@]}}"

products:
  - test_case: [nemotron3_5_lightning_nightly_tp1_pp1_cp1_ep8_dgx_gb200]
    products:
      - environment: [dev]
        scope: [L2]
        cadence: [nightly]
        platforms: [dgx_gb200]
  - test_case: [nemotron3_puzzle_75b_nightly_tp1_pp1_cp1_ep8_dgx_gb200]
    products:
      - environment: [dev]
        scope: [L2]
        cadence: [nightly]
        platforms: [dgx_gb200]
        training_script: [tests/functional_tests/test_cases/nemotron/nemotron3_puzzle_75b_nightly_tp1_pp1_cp1_ep8_dgx_gb200/puzzle.py]
        compare_to_golden: ["false"]
        n_repeat: [1]
