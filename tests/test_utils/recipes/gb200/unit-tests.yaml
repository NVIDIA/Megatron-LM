type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}_{tag}"
  model: unit-tests
  nodes: 1
  build: mcore-pyt-{environment}
  gpus: 4
  platforms: dgx_gb200
  script_setup: |
    set -euo pipefail
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    # Checkout latest
    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD

    # Checkout backwards-ref
    cd /opt
    bash /opt/megatron-lm/.gitlab/scripts/fetch-legacy-suite.sh \
      --backwards-commit $MCORE_BACKWARDS_COMMIT \
      --repo $MCORE_REPO

    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    ls

    TAG={tag}
    ENVIRONMENT={environment}
    BUCKET="{test_case}"
    UNIT_TEST_REPEAT={n_repeat}
    export GPUS_PER_NODE={gpus}

    if [[ "$TAG" == "latest" ]]; then
        TEST_PATH="/opt/megatron-lm"
    else
        TEST_PATH="/opt/megatron-lm-legacy/"
    fi


    if [[ "$BUCKET" == "tests/unit_tests/virtual_experts/**/*.py" ]]; then
        # One pytest launch, with TE fusion flags set before import and a 240s budget.
        cd $TEST_PATH
        VIRTUAL_EXPERT_TEST_COVERAGE=1 \
          bash tests/unit_tests/run_virtual_expert_tests.sh -m launch_on_gb200
    else
        bash $TEST_PATH/tests/unit_tests/run_ci_test.sh \
          --tag $TAG \
          --environment $ENVIRONMENT \
          --bucket $BUCKET \
          --platform gb200 \
          --unit-test-repeat $UNIT_TEST_REPEAT \
          --log-dir {assets_dir}/logs/1/
    fi

    ls -al

    cd $TEST_PATH
    /opt/venv/bin/coverage xml
    cp .coverage {assets_dir}/coverage_report
    cp coverage.xml {assets_dir}

# find_test_cases.py excludes the dedicated child bucket from the catch-all.
# Only the MXFP8 virtual-expert cases carry @pytest.mark.launch_on_gb200.
products:
  - test_case: [tests/unit_tests/**/*.py]
    products:
      - environment: [dev]
        tag: [latest]
        scope: [unit-tests]
        n_repeat: [1]
        time_limit: [1800]

  - test_case: [tests/unit_tests/virtual_experts/**/*.py]
    products:
      - environment: [dev]
        tag: [latest]
        scope: [unit-tests]
        n_repeat: [1]
        time_limit: [600]
