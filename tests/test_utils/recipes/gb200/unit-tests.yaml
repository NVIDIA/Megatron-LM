type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}_{tag}"
  model: unit-tests
  nodes: 1
  build: mcore-pyt-{environment}
  gpus: 4
  platforms: dgx_gb200
  script_setup: |
    set -euo pipefail
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    # Checkout latest
    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD

    # Checkout backwards-ref
    cd /opt
    bash /opt/megatron-lm/.gitlab/scripts/fetch-legacy-suite.sh \
      --backwards-commit $MCORE_BACKWARDS_COMMIT \
      --repo $MCORE_REPO

    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    ls

    TAG={tag}
    ENVIRONMENT={environment}
    BUCKET="{test_case}"
    UNIT_TEST_REPEAT={n_repeat}
    export GPUS_PER_NODE={gpus}

    if [[ "$TAG" == "latest" ]]; then
        TEST_PATH="/opt/megatron-lm"
    else
        TEST_PATH="/opt/megatron-lm-legacy/"
    fi


    if [[ "$BUCKET" == "tests/unit_tests/determinism/kernels/**/*.py" || "$BUCKET" == "tests/unit_tests/determinism/correctness/**/*.py" ]]; then
        # Set before importing Torch or creating CUDA handles; allow scheduling contention.
        export CUDA_DEVICE_MAX_CONNECTIONS=32
        export NCCL_ALGO=Ring CUBLAS_WORKSPACE_CONFIG=:4096:8
        export NVTE_ALLOW_NONDETERMINISTIC_ALGO=0
        export MAMBA_DETERMINISTIC=1 CAUSAL_CONV1D_DETERMINISTIC=1
        unset TRITON_CACHE_AUTOTUNING
        mkdir -p "{assets_dir}/logs"
        export DETERMINISM_EVIDENCE_DIR
        DETERMINISM_EVIDENCE_DIR=$(mktemp -d "{assets_dir}/logs/determinism-shards.XXXXXX")
        export DETERMINISM_EVIDENCE_RUN_ID="{environment}-{platforms}-{tag}-$(basename "$DETERMINISM_EVIDENCE_DIR")"
        EVIDENCE_SCOPE=kernel
        REQUIRED_CASES=(--require-author-checks)
        if [[ "$BUCKET" == "tests/unit_tests/determinism/correctness/**/*.py" ]]; then
            EVIDENCE_SCOPE=model
            REQUIRED_CASES=(--require-parallelism --require-case '*fp8-mxfp8*' --require-case '*fp4-nvfp4*')
        fi
        export PYTEST_ADDOPTS="${{PYTEST_ADDOPTS:-}} -p tools.determinism.pytest_plugin --determinism-evidence-scope=$EVIDENCE_SCOPE --determinism-branch-coverage --determinism-evidence-dir=$DETERMINISM_EVIDENCE_DIR"
        trap 'status=$?; cd "$TEST_PATH"; python -m tools.determinism.coverage "$DETERMINISM_EVIDENCE_DIR" --output "{assets_dir}/logs/determinism-coverage.json" --revision "$(git rev-parse HEAD)" --require-verified --forbid-nondeterministic --require-branches "${{REQUIRED_CASES[@]}}" || status=1; exit "$status"' EXIT
    fi

    bash $TEST_PATH/tests/unit_tests/run_ci_test.sh \
      --tag $TAG \
      --environment $ENVIRONMENT \
      --bucket $BUCKET \
      --platform gb200 \
      --unit-test-repeat $UNIT_TEST_REPEAT \
      --log-dir {assets_dir}/logs/1/

    ls -al

    cd $TEST_PATH
    if [[ -f .coverage ]]; then
        /opt/venv/bin/coverage xml
        cp .coverage {assets_dir}/coverage_report
        cp coverage.xml {assets_dir}
    else
        echo "No unit-test coverage data was produced; skipping coverage export."
    fi

# GB200 selection is marker-driven. find_test_cases.py excludes the dedicated
# replay and M2N buckets from the catch-all, so each marked test runs only once.
# Replay buckets require real numerical evidence.
# Keep M2N in a separate process: NCCL caches the test fixture's transport settings.
products:
  - test_case: [tests/unit_tests/determinism/kernels/**/*.py]
    products:
      - environment: [dev]
        tag: [latest]
        scope: [unit-tests]
        n_repeat: [1]
        time_limit: [1800]
  - test_case: [tests/unit_tests/determinism/correctness/**/*.py]
    products:
      - environment: [dev]
        tag: [latest]
        scope: [unit-tests]
        n_repeat: [1]
        time_limit: [1800]
  - test_case: [tests/unit_tests/**/*.py]
    products:
      - environment: [dev]
        tag: [latest]
        scope: [unit-tests]
        n_repeat: [1]
        time_limit: [1800]
  - test_case: [tests/unit_tests/resharding/test_nccl_m2n_copy_service.py]
    products:
      - environment: [dev]
        tag: [latest]
        scope: [unit-tests]
        n_repeat: [1]
        time_limit: [1800]
  - test_case: [tests/unit_tests/generalized_tensor_parallel/**/*.py]
    products:
      - environment: [dev]
        tag: [latest]
        scope: [unit-tests]
        n_repeat: [1]
        time_limit: [1800]
