type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
launchers:
  name:dgxgb300_oci-jhb:
    mounts:
      /lustre/fsw/coreai_dlalgo_mcore: /lustre/fsw/portfolios/coreai/projects/coreai_dlalgo_mcore/
      /mnt/artifacts: /lustre/fsw/portfolios/coreai/projects/coreai_dlalgo_mcore/mcore_ci
spec:
  name: '{test_case}_{environment}_{platforms}'
  model: gpt
  build: mcore-pyt-{environment}
  nodes: 1
  gpus: 4
  n_repeat: 1
  platforms: dgx_gb300
  time_limit: 3600
  script_setup: |
    set -euo pipefail
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    cd /opt/megatron-lm

    ARGUMENTS=(
        "CONFIG_PATH=tests/performance_tests/test_cases/gpt/{test_case}/model_config.yaml"
        "CHECKPOINT_LOAD_PATH=/mnt/artifacts/"
        "RESULTS_ROOT={assets_dir}/perf_results"
    )

    GPUS_PER_NODE=4 bash ./tests/performance_tests/shell_test_utils/run_perf_test.sh ${{ARGUMENTS[@]}}

products:
  - test_case: [gpt_16b_perf]
    products:
      - environment: [dev]
        scope: [mr]
        platforms: [dgx_gb300]
  - test_case: [gpt_583m_perf_gb200_4gpu, gpt_583m_perf_async_sched_gb200_4gpu]
    products:
      - environment: [dev]
        scope: [mr]
        platforms: [dgx_gb300]
        allow_failure: [true]
