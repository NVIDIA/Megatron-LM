type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}"
  model: gpt
  nodes: 1
  build: mcore-pyt-{environment}
  gpus: 1
  platforms: dgx_h100
  script_setup: |
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    cd /opt/megatron-lm
    uv run --no-sync python tests/performance_tests/shell_test_utils/determinism/kernel_leaderboard.py \
      --output "{assets_dir}/logs/kernel-leaderboard"

products:
  # Report-only pilot; calibration is required before imposing per-kernel budgets.
  - test_case: [determinism_kernel_perf]
    products:
      - environment: [dev]
        scope: [L1]
        cadence: [nightly]
        platforms: [dgx_h100]
        n_repeat: [1]
        time_limit: [3600]
