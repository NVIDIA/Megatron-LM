type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "determinism_state_{state_backend}{state_suffix}_{environment}_{platforms}"
  model: gpt
  nodes: 1
  build: mcore-pyt-{environment}
  gpus: 8
  platforms: dgx_h100
  time_limit_override: 1800
  script_setup: |
    set -euo pipefail
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    set -euo pipefail
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
    cd /opt/megatron-lm
    mkdir -p "{assets_dir}/logs"
    STATE_RUN_PARENT=$(mktemp -d "{assets_dir}/logs/training-state.XXXXXX")
    # Four launches per target; repeat counts do not weaken the protocol gates.
    python -m tools.determinism.run_state_replay \
      --backend {state_backend} --world-size {gpus} \
      --pipeline-size {state_pipeline_size} --virtual-pipeline-size {state_virtual_pipeline_size} \
      --steps {state_steps} --checkpoint-step 2 --control rng {state_stop_args} \
      --output "$STATE_RUN_PARENT/protocol"

products:
  - test_case: [determinism_state]
    products:
      - environment: [dev]
        state_backend: [mcore_gpt, megatron_gpt]
        scope: [mr-github]
        cadence: [pr, nightly]
        platforms: [dgx_h100]
        n_repeat: [1]
        time_limit: [1800]
        state_suffix: [""]
        state_steps: [4]
        state_stop_args: [""]
        state_pipeline_size: [1]
        state_virtual_pipeline_size: [1]
      - environment: [dev]
        state_backend: [mcore_gpt, megatron_gpt]
        scope: [mr-github]
        cadence: [nightly]
        platforms: [dgx_h100]
        n_repeat: [1]
        time_limit: [1800]
        state_suffix: ["_stop_points"]
        state_steps: [5]
        state_stop_args: ["--stop-steps 3 5"]
        state_pipeline_size: [1]
        state_virtual_pipeline_size: [1]
      - environment: [dev]
        state_backend: [megatron_gpt]
        scope: [mr-github]
        cadence: [nightly]
        platforms: [dgx_h100]
        n_repeat: [1]
        time_limit: [1800]
        state_suffix: ["_pp2_stop_points"]
        state_steps: [5]
        state_stop_args: ["--stop-steps 3 5"]
        state_pipeline_size: [2]
        state_virtual_pipeline_size: [1]
      - environment: [dev]
        state_backend: [megatron_gpt]
        scope: [mr-github]
        cadence: [nightly]
        platforms: [dgx_h100]
        n_repeat: [1]
        time_limit: [1800]
        state_suffix: ["_pp2_vpp2_stop_points"]
        state_steps: [5]
        state_stop_args: ["--stop-steps 3 5"]
        state_pipeline_size: [2]
        state_virtual_pipeline_size: [2]
