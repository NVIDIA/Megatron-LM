type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}"
  model: hybrid
  build: mcore-pyt-{environment}
  nodes: 1
  gpus: 8
  n_repeat: 5
  platforms: dgx_h100
  time_limit: 1800
  script_setup: |
    set -euo pipefail
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" \
      >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD
    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    cd /opt/megatron-lm
    TEST_CASE_PATH=tests/functional_tests/test_cases/{model}/{test_case}

    # The native runner edits its input configuration for lightweight mode.
    mkdir -p "{assets_dir}"
    cp "${{TEST_CASE_PATH}}/model_config.yaml" "{assets_dir}/model_config.yaml"

    ARGUMENTS=(
        "DATA_PATH=/mnt/artifacts"
        "DATA_CACHE_PATH=/workspace/data/cache"
        "OUTPUT_PATH={assets_dir}"
        "TENSORBOARD_PATH={assets_dir}/tensorboard"
        "CHECKPOINT_SAVE_PATH={artifacts_dir}/checkpoints"
        "CHECKPOINT_LOAD_PATH={artifacts_dir}/initial-checkpoints"
        "TRAINING_SCRIPT_PATH=pretrain_hybrid.py"
        "TRAINING_PARAMS_PATH={assets_dir}/model_config.yaml"
        "GOLDEN_VALUES_PATH=${{TEST_CASE_PATH}}/golden_values_{environment}_{platforms}.json"
        "N_REPEAT={n_repeat}"
        "ENABLE_LIGHTWEIGHT_MODE=${{ENABLE_LIGHTWEIGHT_MODE:-}}"
        "RECORD_CHECKPOINTS=${{RECORD_CHECKPOINTS:-}}"
    )

    bash ./tests/functional_tests/shell_test_utils/run_ci_test.sh "${{ARGUMENTS[@]}}"

products:
  - test_case: [hybrid_engram_tiny_ckpt_resume]
    products:
      - environment: [dev]
        scope: [L1]
        platforms: [dgx_h100]
