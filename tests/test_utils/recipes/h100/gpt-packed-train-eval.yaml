type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{packing_mode}_{environment}_{platforms}"
  model: gpt
  build: mcore-pyt-{environment}
  nodes: 1
  gpus: 8
  platforms: dgx_h100
  time_limit: 1200
  n_repeat: 1
  script: |-
    set -euo pipefail
    cd /opt/megatron-lm
    export PYTHONPATH="$(pwd):${{PYTHONPATH:-}}"
    export UV_NO_SYNC=1
    for repeat in $(seq 1 {n_repeat}); do
      uv run --no-sync python \
        tests/functional_tests/test_cases/gpt/{test_case}/run_test.py \
        --packing-mode {packing_mode} \
        --output-path {assets_dir}/packed-{packing_mode}-${{repeat}}
    done
products:
  - test_case: [gpt_packed_train_eval]
    products:
      - packing_mode: [static, dynamic]
        environment: [dev]
        scope: [mr-github]
        platforms: [dgx_h100]
