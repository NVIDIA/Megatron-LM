type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}"
  model: hybrid
  build: mcore-pyt-{environment}
  nodes: 1
  gpus: 4
  n_repeat: 2
  platforms: dgx_h100
  time_limit: 1800
  script: |-
    set -euo pipefail
    cd /opt/megatron-lm
    export GPUS_PER_NODE={gpus}
    export PYTHONPATH="$(pwd):${{PYTHONPATH:-}}"
    export UV_NO_SYNC=1
    ARGUMENTS=(
      "DATA_PATH=/mnt/artifacts"
      "DATA_CACHE_PATH={assets_dir}/cache"
      "OUTPUT_PATH={assets_dir}"
      "TENSORBOARD_PATH={assets_dir}/tensorboard"
      "CHECKPOINT_SAVE_PATH={artifacts_dir}/checkpoints"
      "CHECKPOINT_LOAD_PATH={assets_dir}/empty-checkpoints"
      "TRAINING_SCRIPT_PATH=pretrain_hybrid.py"
      "TRAINING_PARAMS_PATH=./tests/functional_tests/test_cases/{model}/{test_case}/model_config.yaml"
      "GOLDEN_VALUES_PATH=./tests/functional_tests/test_cases/{model}/{test_case}/golden_values_{environment}_{platforms}.json"
      "N_REPEAT={n_repeat}"
      "ENABLE_LIGHTWEIGHT_MODE=${{ENABLE_LIGHTWEIGHT_MODE:-}}"
    )
    bash ./tests/functional_tests/shell_test_utils/run_ci_test.sh "${{ARGUMENTS[@]}}"
products:
  - test_case: [hybrid_dynamic_cp_tp1]
    products:
      - environment: [dev]
        scope: [mr-github]
        platforms: [dgx_h100]
  - test_case: [hybrid_dynamic_cp_tp2_sp]
    products:
      - environment: [dev]
        scope: [mr-github]
        platforms: [dgx_h100]
