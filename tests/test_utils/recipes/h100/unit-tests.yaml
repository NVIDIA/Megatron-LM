type: basic
format_version: 1
maintainers: [mcore]
loggers: [stdout]
spec:
  name: "{test_case}_{environment}_{platforms}_{tag}"
  model: unit-tests
  nodes: 1
  build: mcore-pyt-{environment}
  gpus: 8
  platforms: dgx_h100
  script_setup: |
    set -euo pipefail
    unset https_proxy
    umask 077
    printf '%s\n' "machine gitlab-master.nvidia.com login okoenig password $RO_API_TOKEN" >> "$HOME/.netrc"
    trap 'rm -f "$HOME/.netrc"; unset RO_API_TOKEN' EXIT

    # Checkout latest
    cd /opt
    rm -rf /opt/megatron-lm; mkdir megatron-lm; cd megatron-lm
    git init
    git remote add origin $MCORE_REPO
    git fetch origin '+refs/merge-requests/*:refs/remotes/merge-requests/*'
    git fetch origin $MCORE_MR_COMMIT
    git checkout $MCORE_MR_COMMIT
    git rev-parse HEAD

    # Checkout backwards-ref
    cd /opt
    bash /opt/megatron-lm/.gitlab/scripts/fetch-legacy-suite.sh \
      --backwards-commit $MCORE_BACKWARDS_COMMIT \
      --repo $MCORE_REPO

    rm -f "$HOME/.netrc"
    unset RO_API_TOKEN
  script: |-
    rm -f "${{HOME}}/.netrc"
    unset RO_API_TOKEN
    set -euo pipefail
    ls

    TAG={tag}
    ENVIRONMENT={environment}
    BUCKET="{test_case}"
    UNIT_TEST_REPEAT={n_repeat}
    export NVTE_FLASH_ATTN_V4=0

    # GTP scales to any world size; the test fixtures don't — most GTP cases
    # pytest.skip unless world_size==4 exactly (a few also run at 8, see
    # test_gtp_muon.py/test_gtp_muon_qkv.py, and will skip here instead).
    if [[ "$BUCKET" == "tests/unit_tests/generalized_tensor_parallel/**/*.py" ]]; then
        export GPUS_PER_NODE=4
    elif [[ "$BUCKET" == "tests/unit_tests/inference/engines/test_batch_invariant_handoff.py" ]]; then
        # One prefill worker and one decode worker exchange a real NIXL handoff.
        export GPUS_PER_NODE=2
    elif [[ "$BUCKET" =~ ^tests/unit_tests/inference/(test_coordinator_(execution|media|sampling|schedule)_pairwise|engines/test_batch_invariant_coordinator)\.py$ ]]; then
        # These owner-selection schedules are written for exactly two DP replicas.
        export GPUS_PER_NODE=2
    fi

    if [[ "$TAG" == "latest" ]]; then
        TEST_PATH="/opt/megatron-lm"
    else
        TEST_PATH="/opt/megatron-lm-legacy/"
    fi

    case "$BUCKET" in
      tests/unit_tests/inference/test_batch_invariant_fp8.py)
        bash "$TEST_PATH/tests/test_utils/run_batch_invariant_fp8.sh" \
          h100 "$ENVIRONMENT" "$UNIT_TEST_REPEAT" "{assets_dir}/logs/1/"
        ;;
      tests/unit_tests/inference/engines/test_disagg_coordinator_pairwise.py|tests/unit_tests/inference/test_disagg_transfer_pairwise.py)
        bash "$TEST_PATH/tests/test_utils/run_disagg_pairwise.sh" \
          "$ENVIRONMENT" "$UNIT_TEST_REPEAT" "$BUCKET" "{assets_dir}/logs/1/"
        ;;
      *)
        bash $TEST_PATH/tests/unit_tests/run_ci_test.sh \
          --tag $TAG \
          --environment $ENVIRONMENT \
          --bucket $BUCKET \
          --unit-test-repeat $UNIT_TEST_REPEAT \
          --log-dir {assets_dir}/logs/1/
        ;;
    esac

    ls -al 

    cd $TEST_PATH
    if [[ -f .coverage ]]; then
        /opt/venv/bin/coverage xml
        cp .coverage {assets_dir}/coverage_report
        cp coverage.xml {assets_dir}
    else
        echo "No unit-test coverage data was produced; skipping coverage export."
    fi

products:
  # Run the two-worker handoff separately; the broad inference bucket excludes it.
  - test_case: [tests/unit_tests/inference/engines/test_batch_invariant_handoff.py]
    products:
      - environment: [lts, dev]
        tag: [latest]
        scope: [unit-tests]
        gpus: [2]
        n_repeat: [1]
        time_limit: [1800]
  # Two-replica coordinator schedules; the broad inference bucket excludes them.
  - test_case: [tests/unit_tests/inference/engines/test_batch_invariant_coordinator.py]
