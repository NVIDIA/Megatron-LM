# Unit tests that must always run when a source directory changes, regardless of
# what Testmon selects. This file is only consulted in the selective (`enforce`)
# unit-test mode; full and baseline runs already execute every test.
#
# A mapping fires when a file in the PR's changed-file list lives under one of
# its `source_dirs` (prefix match; glob patterns are also accepted). This list
# is independent of the Testmon baseline. Its `test_buckets` are keyed by the
# recipe platform (defined in testmon_cache.py) and list test files, directories,
# or globs.
# Only files that belong to the bucket currently being executed are added to that
# bucket's selection. Naming a whole bucket runs that bucket exhaustively.
mappings:
  # Ordinary Python dependencies and newly added tests are selected by Testmon.
  # These narrow mappings protect dev kernel/dispatch integrations where runtime
  # tracing alone may miss a compiled implementation. Never map all of megatron/.
  - source_dirs:
      - megatron/core/fusions/fused_gated_norm.py
      - megatron/core/fusions/fused_pre_gated_delta_rule.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/ssm/test_gdn_gated_output_norm_fusion.py
        - tests/unit_tests/ssm/test_gdn_gated_output_norm_distributed.py
        - tests/unit_tests/ssm/gated_delta_net/test_gdn_fusion.py
        - tests/unit_tests/determinism/kernels/test_gated_norm.py
      dgx_gb200:
        - tests/unit_tests/ssm/test_gated_delta_net.py
        - tests/unit_tests/determinism/kernels/test_gated_norm.py
  - source_dirs:
      - megatron/core/transformer/experimental_attention_variant/csa_utils/fused_compressor.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/transformer/experimental_attention_variant/test_csa_fused_compressor.py
        - tests/unit_tests/determinism/kernels/test_dsv4_dev_replay.py
      dgx_gb200:
        - tests/unit_tests/determinism/kernels/test_dsv4_dev_replay.py
  - source_dirs:
      - megatron/core/transformer/experimental_attention_variant/csa_utils/thd_layout_kernels.py
      - megatron/core/transformer/experimental_attention_variant/csa_utils/cp_layout_kernels.py
      - megatron/core/transformer/experimental_attention_variant/csa_utils/thd_indexer_kernels.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/transformer/experimental_attention_variant/test_csa_thd_layout_kernels.py
        - tests/unit_tests/transformer/experimental_attention_variant/test_csa_cp_utils.py
        - tests/unit_tests/determinism/kernels/test_dsv4_dev_replay.py
      dgx_gb200:
        - tests/unit_tests/determinism/kernels/test_dsv4_dev_replay.py
  - source_dirs:
      - megatron/core/transformer/experimental_attention_variant/cp_balanced_indexer.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/transformer/test_cp_balanced_indexer_layout.py
        - tests/unit_tests/transformer/experimental_attention_variant/test_cp_balanced_indexer_precision.py
        - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_attention_cp_cuda_graph.py
      dgx_gb200:
        - tests/unit_tests/transformer/experimental_attention_variant/test_dsv4_hybrid_attention_cp_cuda_graph.py
  - source_dirs:
      - megatron/core/fusions/fused_mrope.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/fusions/test_fused_mrope.py
        - tests/unit_tests/determinism/kernels/test_dev_sync_kernels.py
        - examples/multimodal_dev/tests/test_vision_rope_fusion.py
        - examples/multimodal_dev/tests/test_mrope_parity.py
  - source_dirs:
      - megatron/core/fusions/fused_mtp_prefix.py
      - megatron/core/fusions/fused_mtp_tv.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/fusions/test_fused_mtp_prefix.py
        - tests/unit_tests/fusions/test_fused_mtp_tv.py
        - tests/unit_tests/transformer/test_mtp_tv_loss.py
        - tests/unit_tests/determinism/kernels/test_dev_sync_kernels.py
  - source_dirs:
      - megatron/core/optimizer/emerging_optimizers.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/test_emerging_optimizers.py
        - tests/unit_tests/optimizer/test_muon_sync_qkv_cpu.py
  - source_dirs:
      - megatron/core/optimizer/layer_wise_optimizer.py
    test_buckets:
      dgx_h100:
        - tests/unit_tests/test_layer_wise_optimizer.py
        - tests/unit_tests/dist_checkpointing/test_layer_wise_optimizer.py
        - tests/unit_tests/dist_checkpointing/test_layer_wise_optimizer_common_state_dict.py
  - source_dirs:
      - megatron/core/distributed/fsdp/src/megatron_fsdp/experimental
    test_buckets:
      dgx_h100:
        - tests/unit_tests/distributed/mfsdp_v2/**/*.py
      dgx_gb200:
        - tests/unit_tests/distributed/mfsdp_v2/**/*.py
