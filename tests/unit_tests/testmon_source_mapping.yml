# mappings: extra source dependencies that require full unit-test buckets.
mappings:
  # source_dirs: repository-relative directories to watch, including subdirectories.
  # A change in ANY listed directory requires ALL listed buckets for each platform.
  - source_dirs:
      - megatron/core/distributed/fsdp/src/megatron_fsdp/experimental
    # test_buckets: exact recipe test_case values, grouped by hardware platform.
    # Omitted platforms (or empty lists) add no override.
    test_buckets:
      # dgx_h100: list of existing H100 buckets to run fully when a source changes.
      dgx_h100:
        - tests/unit_tests/distributed/mfsdp_v2/**/*.py
